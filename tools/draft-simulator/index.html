<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Trek Draft Simulator</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3342;
  --txt:#e8edf3; --dim:#9aa7b8; --acc:#7ee787; --gold:#f0b429;
  --r-m:#e6484d; --r-r:#c9a227; --r-u:#8fa3bf; --r-c:#6e7681;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.topbar h1{font-size:1.35rem;margin:0}
.topbar h1 small{display:block;font-size:.8rem;color:var(--dim);font-weight:400}
.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.pill b{color:var(--gold)}
.hint{color:var(--dim);font-size:.9rem;margin:8px 0 4px}
.dir{color:var(--acc);font-size:.9rem;font-weight:600;margin:0 0 12px}
.pnote{font-size:.82rem;color:var(--dim);padding:2px 2px 8px}
.gnote{font-size:.92rem;padding:7px 0;border-bottom:1px solid var(--line);text-align:left}
.gnote:last-child{border-bottom:0}
#gradeTitle{margin:0 0 4px;font-size:1.35rem}
#gradeTitle b{color:var(--gold)}
#gradeCard{color:var(--dim);font-size:.9rem;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.card:hover{transform:translateY(-2px);border-color:#4a5a75}
.card img{width:100%;display:block;aspect-ratio:5/7;object-fit:cover;background:var(--panel2)}
.card .cname{font-weight:600;font-size:.8rem;line-height:1.2;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.card .cname .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rar{flex:none;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.04em}
.rar.M{background:#3d1f22;color:var(--r-m);border:1px solid var(--r-m)}
.rar.R{background:#38300f;color:var(--r-r);border:1px solid var(--r-r)}
.rar.U{background:#232c3b;color:var(--r-u);border:1px solid var(--r-u)}
.rar.C{background:#22262c;color:var(--r-c);border:1px solid var(--r-c)}
.controls{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:11px 20px;font-size:1rem;font-weight:600}
button.primary{background:#1f6feb;border-color:#1f6feb}
button.primary:hover{background:#2b7fff}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:380px;width:100%;padding:16px;text-align:center;max-height:92vh;overflow:auto}
.sheet img{width:100%;border-radius:10px}
.sheet .fallback{padding:30px 10px;text-align:left;font-size:.9rem;color:var(--dim);white-space:pre-wrap}
.sheet h3{margin:10px 0 4px;font-size:1.05rem}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet .row button{flex:1}
/* pool + results */
.poolview{display:none;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.poolview.show{display:block}
.poolview h3, .results h3{margin:14px 0 6px;font-size:1rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-size:.82rem}
.poolview h3:first-child, .results h3:first-child{margin-top:0}
.prow{display:flex;justify-content:space-between;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:.92rem}
.prow:last-child{border-bottom:0}
.pname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrade{font-weight:700;color:var(--gold);flex:none}
.results{display:none;margin-top:18px}
.results.show{display:block}
.results h2{margin:0 0 8px;font-size:1.25rem}
.suggest{color:var(--dim);font-size:.95rem}
.suggest b{color:var(--acc)}
.stable{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}
.stable th,.stable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.stable th{color:var(--dim);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
a.home{color:var(--dim);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Star Trek Draft Simulator<small>8-seat pod — you vs 7 AI drafters · 3 packs</small></h1>
    <div class="stats">
      <div class="pill">Pack <b id="packNum">1</b> / 3</div>
      <div class="pill">Pick <b id="pickNum">1</b></div>
      <div class="pill">Pool <b id="poolNum">0</b></div>
    </div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="dir" id="dir"></div>
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button id="poolBtn">My pool (0)</button>
  </div>
  <div class="poolview" id="poolview"></div>
  <div class="results" id="results"></div>
  <p style="margin-top:30px"><a class="home" href="../../">← Back to wesward</a></p>
</div>

<div class="modal" id="gradeModal">
  <div class="sheet">
    <h3 id="gradeTitle"></h3>
    <div id="gradeCard"></div>
    <div id="gradeNotes"></div>
    <div class="row"><button class="primary" id="gradeNextBtn">Next pick →</button></div>
  </div>
</div>

<script>
const CARDS = [{"n":"Captain Jean-Luc Picard","c":"{2}{W}","t":"Legendary Creature 2/3","r":"M","g":"A-","note":"The white mythic captain: an anthem that prints Officers and can tutor a Spacecraft straight into play.","img":"https://cards.scryfall.io/normal/front/b/7/b7114271-eb05-41e2-ad96-a34f53492312.jpg?1792508148"},{"n":"Excalbian Gamemaster","c":"{5}{W}","t":"Creature 6/6","r":"M","g":"A-","note":"A 6/6 that enters with an Officer token per differently named land you control, then hands out counters whenever your creatures die.","img":"https://cards.scryfall.io/normal/front/3/1/31b5780c-8c5f-4836-8848-1eea1d416a93.jpg?1792753846"},{"n":"U.S.S. Enterprise-A, Free Spirit","c":"{3}{W}{W}","t":"Legendary Artifact","r":"M","g":"A-","note":"Warded 5/5 that arrives with three Officers to station it, then flies with lifelink.","img":"https://cards.scryfall.io/normal/front/9/9/99429015-6e5d-4ecf-aaf7-eba181bcffc7.jpg?1792508162"},{"n":"Dr. Beverly Crusher","c":"{2}{W}","t":"Legendary Creature 2/2","r":"M","g":"B+","note":"Lifegain trigger doubler and payoff in one mythic; needs a lifegain shell to sing.","img":"https://cards.scryfall.io/normal/front/e/f/ef9c5790-d909-4271-90bd-5fa4816ddd6b.jpg?1784065540"},{"n":"Antagonist Incorporator","c":"{1}{W}","t":"Artifact Creature 2/3","r":"R","g":"B","note":"A 2/3 Borg lord whose artifact creatures print 1/1 Borg tokens when they connect - for {1} a head.","img":"https://cards.scryfall.io/normal/front/6/3/63918e59-0c03-4d98-9216-e58ee157b7ea.jpg?1792668297"},{"n":"Deanna Troi, Psychic Counsel","c":"{1}{W}","t":"Legendary Creature 2/2","r":"R","g":"B","note":"A 2/2 for two whose other creatures all enter with an additional +1/+1 counter - the counters deck's quiet force multiplier.","img":"https://cards.scryfall.io/normal/front/1/a/1a027761-84e7-4cbf-a629-ae9bd3d8467b.jpg?1793100632"},{"n":"Ghost of Illyria","c":"{3}{W}","t":"Creature 3/3","r":"U","g":"B","note":"A 3/3 flying Spirit for {3}{W}, uncommon, whose entry blinks another nonland permanent you control until the end step - an ETB rebuy on a flyer.","img":"https://cards.scryfall.io/normal/front/9/9/99830058-c97a-4326-8c2f-8658cf8a1561.jpg?1793359367"},{"n":"Miles O'Brien, Transporter Ops","c":"{2}{W}","t":"Legendary Creature 3/3","r":"R","g":"B","note":"Bounces your own creature or artifact back to hand, then draws at end step for the trouble - the transporter chief runs the bounce deck.","img":"https://cards.scryfall.io/normal/front/e/4/e4f041b3-e785-45ba-9a7e-33878614d3b0.jpg?1793361164"},{"n":"Test of Conviction","c":"{1}{W}","t":"Sorcery","r":"U","g":"B","note":"Team-wide +1/+1 counter, or draw two while an opponent draws one. Diplomacy has never been this efficient.","img":"https://cards.scryfall.io/normal/front/8/3/837d7cec-f3f8-4555-86f2-c5ea1849d7d1.jpg?1792668317"},{"n":"U.S.S. Excelsior, Cutting Edge","c":"{3}{W}","t":"Legendary Artifact","r":"U","g":"B","note":"A Spacecraft whose entry destroys a tapped creature an opponent controls; stationed at 8+, it is a 4/4 flyer.","img":"https://cards.scryfall.io/normal/front/d/e/de62b452-3780-4eeb-8163-f44176495615.jpg?1793100663"},{"n":"70,000 Light-Years from Home","c":"{1}{W}","t":"Sorcery","r":"U","g":"B-","note":"White's Path-style exile; the land-to-hand rebate is the price.","img":"https://cards.scryfall.io/normal/front/0/2/02080f42-863a-471b-992b-67e35ef1b7b7.jpg?1786005780"},{"n":"Assembly Specialist","c":"{1}{W}","t":"Artifact Creature 1/1","r":"U","g":"B-","note":"Two mana for two 1/1 Borg artifact creatures - the body plus its ETB token are cheap station fodder and Borg-board density.","img":"https://cards.scryfall.io/normal/front/a/4/a4d339a5-198c-49bd-845e-2632476746e0.jpg?1793100612"},{"n":"Brad Boimler, Eager Ensign","c":"{1}{W}","t":"Legendary Creature 2/2","r":"U","g":"B-","note":"Counter-multiplier engine for the counters deck; a fine 2/2 lifelink anywhere.","img":"https://cards.scryfall.io/normal/front/a/6/a6bf1525-2212-46d0-ad4d-1dbaa2e3b3cd.jpg?1784036739"},{"n":"Captain Benjamin Sisko","c":"{1}{W}","t":"Legendary Creature 2/2","r":"R","g":"B-","note":"The five-color captain: dilemma play makes Officers, and seven mana plus a board casts from the top for free.","img":"https://cards.scryfall.io/normal/front/5/1/51338fb2-13a3-41b8-981f-05fa35e87e2e.jpg?1792508139"},{"n":"Command Subadjunct","c":"{W}","t":"Artifact Creature 2/1","r":"U","g":"B-","note":"A one-mana 2/1 Borg that gives your artifact creatures vigilance. (Near-twin of the meme lord - same rate, same anthem, serious name.)","img":"https://cards.scryfall.io/normal/front/8/5/853bf74d-0b61-43df-9018-0b40b624a9d1.jpg?1792753641"},{"n":"Conquest Mission","c":"{2}{W}","t":"Enchantment","r":"U","g":"B-","note":"Every nontoken artifact you play also makes a Borg token; at six quest counters, two at a time.","img":"https://cards.scryfall.io/normal/front/f/9/f91755d7-6fb9-4caf-b4b4-f21ed5572d52.jpg?1792750872"},{"n":"Malfunctioning Holodeck","c":"{2}{W}","t":"Artifact","r":"C","g":"B-","note":"A warded O-Ring that answers any nonland permanent.","img":"https://cards.scryfall.io/normal/front/0/f/0faeffee-bb07-4b9d-8cdd-e9731bbd2396.jpg?1785981349"},{"n":"Oberth-Class Starship","c":"{1}{W}","t":"Artifact","r":"C","g":"B-","note":"A two-mana Spacecraft that searches a basic Plains into your hand on entry and stations at 6+ into a 2/2 flyer.","img":"https://cards.scryfall.io/normal/front/7/e/7efe3788-ecf7-4b56-8970-bc324092941c.jpg?1793361187"},{"n":"Primary Unimatrix Adjunct","c":"{3}{W}","t":"Artifact Creature 2/3","r":"R","g":"B-","note":"A 2/3 Borg adjunct that gives your artifact creatures double strike. In the Borg deck, that is the whole sentence.","img":"https://cards.scryfall.io/normal/front/b/9/b94a582c-11bb-4463-a826-bd0c79366752.jpg?1792753859"},{"n":"Rutherford, Upgraded Ensign","c":"{2}{W}","t":"Legendary Creature 2/2","r":"U","g":"B-","note":"Digs six cards deep for an artifact on entry, and puts a counter on a creature whenever you cast a Spacecraft.","img": y's coffee run: dig five for a cheap permanent, then Beam me up and dig again.","img":"https://cards.scryfall.io/normal/front/8/d/8dd7e0c6-84f6-4570-af93-4c64e78c2868.jpg?1792668331"},{"n":"Andromedan Automatons","c":"{2}{W}","t":"Artifact Creature 3/1","r":"C","g":"C+","note":"A 3/1 artifact Android whose entry lets you search your library for every other copy of itself and put them into your hand.","img":"https://cards.scryfall.io/normal/front/f/c/fc386662-0fe3-432f-85a8-9a06e1274245.jpg?1793361152"},{"n":"Command Decision","c":"{1}{W}","t":"Sorcery","r":"C","g":"C+","note":"Modal filler: a narrow kill spell that can always cycle.","img":"https://cards.scryfall.io/normal/front/9/f/9f1f789b-5c08-4a4d-b3a3-4d51ad9f1a4d.jpg?1785981318"},{"n":"Dr. McCoy, Surly Surgeon","c":"{2}{W}{W}","t":"Legendary Creature 2/2","r":"U","g":"C+","note":"Donates a counter on entry, then refuses to let your countered creatures be destroyed - they shed counters and heal instead.","img":"https://cards.scryfall.io/normal/front/b/3/b300d814-cf74-44ba-b253-ec179ec54a20.jpg?1792668584"},{"n":"Federation Field Medic","c":"{3}{W}","t":"Creature 3/2","r":"C","g":"C+","note":"Modal ETB: counter now, or a card if your board already wears counters.","img":"https://cards.scryfall.io/normal/front/b/3/b312dacd-b87f-44c1-a804-bee221e70f52.jpg?1785981333"},{"n":"Federation Resupply","c":"{1}{W}","t":"Sorcery","r":"R","g":"C+","note":"A white sorcery that tutors an Aura, Equipment, or Spacecraft into your hand - and beams back up from the graveyard for {3}{W}.","img":"https://cards.scryfall.io/normal/front/5/6/5626c58f-9245-437a-9844-b023320cf709.jpg?1793273787"},{"n":"Hologram Janeway","c":"{2}{W}","t":"Legendary Artifact Creature 3/3","r":"U","g":"C+","note":"A 3/3 hologram who puts a +1/+1 counter on a creature whenever you attack with total power 8 or more across your board.","img":"https://cards.scryfall.io/normal/front/0/2/02d29047-a7b8-43fb-8b90-b35ba34da5f9.jpg?1793100636"},{"n":"Pet Sehlat","c" :"{2}","t":"Artifact","r":"C","g":"C+","note":"Picard's tea is a Food that draws a card on entry, then trades itself for 2 damage or 3 life.","img":"https://cards.scryfall.io/normal/front/2/8/289e8ebe-ab0f-466b-a4e6-d5cf8411e724.jpg?1793361401"},{"n":"The Holodeck","c":"{7}","t":"Legendary Artifact","r":"R","g":"C+","note":"Replays a permanent from your graveyard every turn. Seven mana of pure second chances.","img":"https://cards.scryfall.io/normal/front/5/7/57e830f5-564d-4899-87c0-74192c561fc8.jpg?1792508432"},{"n":"Unexplored Territory","c":"","t":"Land","r":"C","g":"C+","note":"A colorless land that cashes itself in for a basic land straight onto the battlefield.","img":"https://cards.scryfall.io/normal/front/c/a/ca1e60f1-11a9-4bb8-9f6e-5b652b49c517.jpg?1793361459"},{"n":"Vulcan","c":"","t":"Land","r":"C","g":"C+","note":"WU Planet gainland; fixing plus a named land.","img":"https://cards.scryfall.io/normal/front/f/c/fc3fe0da-8d93-4f1c-9aad-c2fdc9fe34fc.jpg?1792632981"},{"n":"Warp Core","c":"{2}","t":"Artifact","r":"C","g":"C+","note":"Fetches a basic on entry and pumps charge counters into your Spacecraft at sorcery speed.","img":"https://cards.scryfall.io/normal/front/d/e/de8e2bde-b368-4d10-8409-86f5da6997f6.jpg?1793361423"},{"n":"Cybernetic Specialist","c":"{2}","t":"Artifact Creature 2/1","r":"C","g":"C","note":"Surveil on a 2/1, plus a library-bottom reset that is NOT recursion.","img":"https://cards.scryfall.io/normal/front/b/1/b147f16e-a2d6-4d43-9213-9a2723b0d3ef.jpg?1786005495"},{"n":"Federation Outpost","c":"","t":"Land","r":"R","g":"C","note":"White's bonus land: life or surveil when it enters untapped, then taps for {W}.","img":"https://cards.scryfall.io/normal/front/0/2/02e368bd-ece8-4201-8d1a-4c5287d5cfee.jpg?1792632946"},{"n":"Quark's Bar","c":"","t":"Land","r":"R","g":"C","note":"Red's bonus land: ping each opponent or surveil when it enters untapped.","img":"https://cards.scryfall.io/normal/front/8/4/8422ee4a-9845-429d-bda8-74852168dcba.jpg?17926 <script>
const GRADE_VAL = {'S':12,'A+':11,'A':10,'A-':9,'B+':8,'B':7,'B-':6,'C+':5,'C':4,'C-':3,'D+':2,'D':1,'F':0};
const POOL = {M:[],R:[],U:[],C:[]};
CARDS.forEach(c=>{ if(POOL[c.r]) POOL[c.r].push(c); });
const COLOR_NAME = {W:'White',U:'Blue',B:'Black',R:'Red',G:'Green'};
const GROUP_ORDER = ['White','Blue','Black','Red','Green','Multi','Colorless'];
const SEATS=8, ROUNDS=3, PACK_SIZE=14;

let seats=[], round=0, dir=1, poolOpen=false, picks=[];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function manaHTML(cost){
  if(!cost) return '<span style="color:var(--dim);font-size:.8rem">land</span>';
  return cost.replace(/\{([^}]+)\}/g,function(m,s){
    const sym=s.replace('/','');
    return '<img src="https://svgs.scryfall.io/card-symbols/'+encodeURIComponent(sym)+'.svg" alt="'+s+'" loading="lazy">';
  });
}
function cardColors(c){
  if(!c.c) return [];
  const m=c.c.match(/[WUBRG]/g);
  return m?[...new Set(m)]:[];
}
function colorGroup(c){
  const cols=cardColors(c);
  if(cols.length===0) return 'Colorless';
  if(cols.length>1) return 'Multi';
  return COLOR_NAME[cols[0]];
}
function buildRealPack(){
  // A realistic 14-card draft booster: 1 rare/mythic, 3 uncommons, 10 commons.
  // Common lands are capped at 1 per pack — real collation spreads the land
  // cycle out, you basically never see 3 nonbasic lands in a paper pack.
  const pack=[]; const used=new Set(); let landTaken=false;
  function isLand(c){ return /Land/.test(c.t||''); }
  function take(pool,capLand){
    let guard=0;
    while(guard++<500){
      const c=pool[Math.floor(Math.random()*pool.length)];
      if(!c || used.has(c.n)) continue;
      if(capLand && landTaken && isLand(c)) continue;
      used.add(c.n); pack.push(c);
      if(isLand(c)) landTaken=true;
      return;
    }
  }
  take(Math.random()<1/7.5 && POOL.M.length ? POOL.M : POOL.R); // mythic ~1 in 7.5 packs
  for(let i=0;i<3;i++) take(POOL.U.length?POOL.U:POOL.C);
  for(let i=0;i<10;i++) take(POOL.C.length?POOL.C:POOL.U,true);
  return pack;
}
// How an AI drafter thinks: take the best card early, then commit to the two
// colors its picks point at and favor on-color cards after that.
function aiColors(pool){
  if(pool.length<4) return [];
  const sc={W:0,U:0,B:0,R:0,G:0};
  pool.forEach(c=>{
    const g=GRADE_VAL[c.g]||0;
    cardColors(c).forEach(col=>{ sc[col]+=2+g*0.25; });
  });
  return Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,2);
}
function aiPick(seat){
  const pack=seat.pack, pool=seat.pool;
  const colors=aiColors(pool);
  let best=null, bs=-1e9;
  for(const c of pack){
    const g=GRADE_VAL[c.g]||0;
    let s=g;
    const cols=cardColors(c);
    if(colors.length===0){ s+=Math.random()*0.6; }
    else if(cols.length===0){ s+=1.0; }
    else{
      const inC=cols.filter(x=>colors.indexOf(x)>=0).length;
      if(inC===cols.length) s+=2.5;
      else if(inC>0) s+=0.5;
      else s-=2.0;
    }
    if(s>bs){ bs=s; best=c; }
  }
  return best;
}
function cmc(c){
  if(!c.c) return 0;
  let n=0;
  c.c.replace(/\{([^}]+)\}/g,function(m,s){
    if(/^\d+$/.test(s)) n+=parseInt(s,10);
    else if(s!=='X') n+=1;
  });
  return n;
}
function scoreToLetter(s){
  if(s>=9.5) return 'A+';
  if(s>=8.5) return 'A';
  if(s>=7.5) return 'A-';
  if(s>=6.5) return 'B+';
  if(s>=5.5) return 'B';
  if(s>=4.5) return 'B-';
  if(s>=3.5) return 'C+';
  if(s>=2.5) return 'C';
  if(s>=1.5) return 'C-';
  if(s>=0.5) return 'D';
  return 'F';
}
// --- Color commitment and effective value ---------------------------------
// A card's raw guide grade is NOT its value to this pool. Once your colors
// start committing, every pip you cannot pay discounts the card, and the
// discount grows as the draft goes on: a splash you could still pivot into
// in Pack 1 is a dead card in Pack 3, and a double-pip off-color card is
// the hardest splash of all. Grades below compare EFFECTIVE values — raw
// grade minus the commitment-stage pip penalty — never raw grades alone.
function pipTokens(c){
  const front=(c.c||'').split('//')[0];
  const toks=[]; let m; const re=/\{([^}]+)\}/g;
  while((m=re.exec(front))!==null) toks.push(m[1]);
  return toks;
}
function offPips(c,colors){
  // colors: committed color letters, e.g. ['R','B']
  if(!colors.length) return {n:0,cols:[]};
  let n=0; const cols=[];
  pipTokens(c).forEach(t=>{
    if(/^\d+$/.test(t)||t==='X'||t==='C') return;
    if(t.indexOf('/')>=0){
      const parts=t.split('/');
      if(parts.some(p=>/^\d+$/.test(p))) return; // {2/W} style: payable with generic mana
      if(parts.some(p=>colors.indexOf(p)>=0)) return; // hybrid: one payable side is enough
      n++; parts.forEach(p=>{ if(cols.indexOf(p)<0) cols.push(p); });
      return;
    }
    if(colors.indexOf(t)<0){ n++; if(cols.indexOf(t)<0) cols.push(t); }
  });
  return {n:n,cols:cols};
}
function commitmentStage(poolBefore){
  const total=poolBefore.length;
  if(total<8) return 'early';   // Pack 1, still forming — stay open
  if(total<28) return 'mid';    // rest of Pack 1 + Pack 2 — committing
  return 'late';                // Pack 3 — colors are locked
}
const STAGE_PIP_PENALTY={early:1,mid:2,late:3};
function effectiveVal(c,colors,stage){
  const raw=GRADE_VAL[c.g]||0;
  if(!colors.length) return {raw:raw,eff:raw,off:{n:0,cols:[]}};
  const off=offPips(c,colors);
  return {raw:raw,eff:raw-off.n*STAGE_PIP_PENALTY[stage],off:off};
}
function valToLetter(v){
  const names=Object.keys(GRADE_VAL).sort((a,b)=>GRADE_VAL[b]-GRADE_VAL[a]);
  for(const nm of names){ if(v>=GRADE_VAL[nm]-0.5) return nm; }
  return 'F';
}
function fitLabel(c,colors){
  // Self-contained color-fit description FOR THIS CARD ONLY, with its cost,
  // so a note can never read as if it described a different card.
  const cost=(c.c||'').split('//')[0].trim();
  const cnames=colors.map(x=>COLOR_NAME[x]).join('/');
  if(!cost||cardColors(c).length===0) return 'colorless ('+(cost||'land')+') — castable in any deck';
  const off=offPips(c,colors);
  if(off.n===0) return 'castable on your '+cnames+' mana ('+cost+')';
  return 'off-color for your '+cnames+' ('+cost+' needs '+off.cols.map(x=>COLOR_NAME[x]).join('/')+')';
}
function typeCounts(pool){
  let cre=0,spl=0;
  pool.forEach(c=>{
    if(/Creature/.test(c.t||'')) cre++;
    else if(!/Land/.test(c.t||'')) spl++;
  });
  return {cre:cre,spl:spl};
}
// Grade one of Wes's picks against the best card for HIS POOL in the pack at
// that moment (effective value, above), and flag curve pile-ups plus
// creature/spell balance problems as the end of the draft approaches.
function gradeWesPick(card,packBefore,poolBefore,packNo,pickNo){
  const colors=aiColors(poolBefore);
  const stage=commitmentStage(poolBefore);
  const cnames=colors.map(x=>COLOR_NAME[x]).join('/');
  const mine=effectiveVal(card,colors,stage);
  let bestEff=-1e9,bestCard=null,rawBest=-1,rawCard=null;
  packBefore.forEach(c=>{
    const info=effectiveVal(c,colors,stage);
    if(info.eff>bestEff){ bestEff=info.eff; bestCard=c; }
    if(info.raw>rawBest){ rawBest=info.raw; rawCard=c; }
  });
  const diff=bestEff-mine.eff;
  const score=10-Math.max(0,diff)*1.5;
  const notes=[];
  if(diff<=0){
    if(rawCard&&rawCard!==card&&rawBest>mine.raw){
      notes.push('Best pick for your pool. '+rawCard.n+' ('+rawCard.g+') grades higher on raw power, but it is '+fitLabel(rawCard,colors)+' — for this pool it is really about a '+valToLetter(effectiveVal(rawCard,colors,stage).eff)+', so it does not beat your pick.');
    }else{
      notes.push('Best card in the pack for your pool.');
    }
  }else if(bestCard&&bestCard!==card){
    notes.push('Better available for your '+(cnames||'pool')+': '+bestCard.n+' ('+bestCard.g+') — '+fitLabel(bestCard,colors)+'.');
  }
  if(!colors.length){
    notes.push('Early pick — no colors committed yet; taking power and staying open.');
  }else if(mine.off.n===0){
    // Explain a pick that only LOOKS off-color (hybrid / generic-hybrid pips)
    const looksOff=cardColors(card).some(x=>colors.indexOf(x)<0);
    if(looksOff) notes.push('Your pick only looks off-color — it is '+fitLabel(card,colors)+'.');
  }else{
    if(stage==='late') notes.push('Your pick is '+fitLabel(card,colors)+'. In Pack 3 there is almost no time or fixing left to splash it — this grade counts it as nearly a dead pick.');
    else if(stage==='mid') notes.push('Your pick is '+fitLabel(card,colors)+'. That splash/pivot cost is counted in this grade.');
    else notes.push('Your pick is '+fitLabel(card,colors)+', but this early a pivot is still cheap.');
  }
  if(poolBefore.length>=8){
    const c=cmc(card);
    const atCmc=poolBefore.filter(x=>cmc(x)===c).length+1;
    if(atCmc>=7) notes.push('Curve is getting heavy at '+c+' mana ('+atCmc+' cards).');
  }
  // Creature / spell balance — soft heads-up late in Pack 2, a real warning
  // in Pack 3, when there are few picks left to fix it. A playable deck
  // wants roughly 15 creatures; lands are excluded from both counts.
  const after=typeCounts(poolBefore.concat([card]));
  const totalAfter=poolBefore.length+1;
  const picksLeft=ROUNDS*PACK_SIZE-totalAfter;
  if(totalAfter>=28){
    if(after.cre<=10) notes.push('Creature warning: only '+after.cre+' creatures with '+picksLeft+' picks left — you need creatures with almost every remaining pick to reach a playable ~15.');
    else if(after.cre<=12&&picksLeft<=10) notes.push('Creature count is light: '+after.cre+' creatures with '+picksLeft+' picks left — prioritize creatures from here.');
    else if(after.spl>=11&&after.cre<=14) notes.push('Spell-heavy warning: '+after.spl+' spells vs '+after.cre+' creatures with '+picksLeft+' picks left — prioritize creatures from here.');
    else if(after.cre>=20) notes.push('Creature-heavy: '+after.cre+' creatures and only '+after.spl+' spells — a trick or removal spell is worth more than another body from here.');
  }else if(totalAfter>=20){
    if(after.cre<=8) notes.push('Heads up — creature count is low for this late: only '+after.cre+' creatures with '+picksLeft+' picks left. Start prioritizing creatures.');
    else if(after.spl>=10&&after.cre<=11) notes.push('Heads up — spells are piling up ('+after.spl+' spells vs '+after.cre+' creatures) with '+picksLeft+' picks left. Prioritize creatures from here.');
  }
  return {letter:scoreToLetter(score),score:score,notes:notes,card:card,packNo:packNo,pickNo:pickNo,diff:Math.max(0,diff)};
}

function newDraft(){
  seats=[]; for(let i=0;i<SEATS;i++) seats.push({pool:[],pack:null});
  round=0; poolOpen=false; picks=[];
  document.getElementById('poolview').className='poolview';
  document.getElementById('results').className='results';
  document.getElementById('results').innerHTML='';
  startRound();
}
function startRound(){
  dir = round%2===0 ? 1 : -1; // pack 1 left, pack 2 right, pack 3 left
  seats.forEach(s=>{ s.pack=buildRealPack(); });
  renderAll();
}
function renderAll(){
  renderPack();
  document.getElementById('packNum').textContent=round+1;
  document.getElementById('poolNum').textContent=seats[0].pool.length;
  document.getElementById('poolBtn').textContent='My pool ('+seats[0].pool.length+')';
  document.getElementById('dir').textContent = dir===1 ? '\u2190 Passing left' : 'Passing right \u2192';
  if(poolOpen) renderPoolView();
}
function renderPack(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const pack=seats[0].pack||[];
  const pickNo=PACK_SIZE-pack.length+1;
  document.getElementById('pickNum').textContent=pickNo;
  pack.forEach(c=>{
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML='<img src="'+c.img+'" alt="'+esc(c.n)+'" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;cname&quot; style=&quot;padding:24px 8px;white-space:normal&quot;>'+esc(c.n)+'</div>\'">'
      +'<div class="cname"><span class="n">'+esc(c.n)+'</span><span class="rar '+c.r+'">'+c.r+'</span></div>';
    d.addEventListener('click',()=>doWesPick(c));
    grid.appendChild(d);
  });
  document.getElementById('hint').textContent=
    'Pack '+(round+1)+' of '+ROUNDS+' \u00B7 Pick '+pickNo+' \u2014 '+pack.length+' cards in the pack. Tap a card to draft it. You are Seat 1.';
}
let afterGrade=null;
function doWesPick(card){
  const me=seats[0];
  const packBefore=me.pack.slice();
  const poolBefore=me.pool.slice();
  const pickNo=PACK_SIZE-me.pack.length+1;
  me.pool.push(card);
  me.pack=me.pack.filter(x=>x!==card);
  const analysis=gradeWesPick(card,packBefore,poolBefore,round+1,pickNo);
  picks.push(analysis);
  // the 7 AI seats draft from their packs
  for(let i=1;i<SEATS;i++){
    const s=seats[i];
    if(s.pack && s.pack.length){
      const c=aiPick(s);
      s.pool.push(c);
      s.pack=s.pack.filter(x=>x!==c);
    }
  }
  // pass every pack simultaneously
  const old=seats.map(s=>s.pack);
  seats.forEach((s,i)=>{ s.pack=old[(i-dir+SEATS)%SEATS]; });
  const isLast=(round===ROUNDS-1)&&seats.every(s=>!s.pack || s.pack.length===0);
  afterGrade=function(){
    if(seats.every(s=>!s.pack || s.pack.length===0)){
      round++;
      if(round>=ROUNDS){ endDraft(); return; }
      startRound(); return;
    }
    renderAll();
  };
  showGradePopup(analysis,card,pickNo,isLast);
}
function showGradePopup(a,card,pickNo,isLast){
  document.getElementById('gradeTitle').innerHTML='Pick '+pickNo+' — <b>'+a.letter+'</b>';
  document.getElementById('gradeCard').textContent=card.n+' ('+card.g+')';
  document.getElementById('gradeNotes').innerHTML=a.notes.map(n=>'<div class="gnote">'+esc(n)+'</div>').join('');
  document.getElementById('gradeNextBtn').textContent=isLast?'See results →':'Next pick →';
  document.getElementById('gradeModal').classList.add('open');
}
function closeGradePopup(){ document.getElementById('gradeModal').classList.remove('open'); }
document.getElementById('gradeNextBtn').addEventListener('click',()=>{
  closeGradePopup();
  const f=afterGrade; afterGrade=null;
  if(f) f();
});
// --- Pool sorting / filtering ----------------------------------------------
// Sort keys are applied in the order they are tapped (first tap = primary
// key); color and type filters are multi-select; Clear resets everything
// back to the whole pool in the default color-grouped view.
const poolUI={sorts:[],colors:[],types:[]};
const SORT_KEYS=[['mv','Mana cost'],['color','Color'],['type','Type'],['role','Role'],['grade','Grade']];
function typeLabel(c){
  const t=c.t||'';
  if(/Land/.test(t)) return 'Land';
  if(/Creature/.test(t)) return 'Creature';
  if(/Planeswalker/.test(t)) return 'Planeswalker';
  if(/Instant/.test(t)) return 'Instant';
  if(/Sorcery/.test(t)) return 'Sorcery';
  if(/Enchantment/.test(t)) return 'Enchantment';
  if(/Artifact/.test(t)) return 'Artifact';
  return 'Other';
}
function cardRole(c){
  const t=c.t||'', note=(c.note||'').toLowerCase();
  if(/Land/.test(t)) return 'Land / fixing';
  if(/destroy|damage|fight|exile|tuck|burn|wipe|-1\/-1/.test(note)) return 'Removal';
  if(/counter target|counterspell|negate/.test(note)) return 'Counterspell';
  if(/bounce|return target.*hand|tempo/.test(note)) return 'Bounce / tempo';
  if(/draw|loot|impulse|card advantage/.test(note)) return 'Card draw';
  if(/ramp|mana rock|adds .*mana/.test(note)) return 'Ramp / fixing';
  if(/flashback|recursion|reanimate|return.*graveyard to your hand/.test(note)) return 'Recursion';
  if(/hexproof|indestructible|protection/.test(note)) return 'Protection';
  if(/pump|anthem|team \+|\+1\/\+1 counter/.test(note)) return 'Pump / anthem';
  if(/surveil|scry/.test(note)) return 'Selection';
  if(/Creature/.test(t)) return 'Creature';
  return 'Spell';
}
function sortVal(c,key){
  if(key==='mv') return cmc(c);
  if(key==='color') return GROUP_ORDER.indexOf(colorGroup(c));
  if(key==='type') return typeLabel(c);
  if(key==='role') return cardRole(c);
  if(key==='grade') return -(GRADE_VAL[c.g]||0);
  return 0;
}
function poolFiltered(pool){
  return pool.filter(c=>{
    if(poolUI.colors.length){
      // A single-color chip matches any card that CONTAINS that color, so a
      // Green/White card shows under Green and under White (it is castable
      // in either deck) — not only under a separate Multicolor bucket.
      const cols=cardColors(c);
      const match=poolUI.colors.some(sel=>{
        if(sel==='Multi') return cols.length>1;
        if(sel==='Colorless') return cols.length===0;
        const letter=Object.keys(COLOR_NAME).filter(k=>COLOR_NAME[k]===sel)[0];
        return cols.indexOf(letter)>=0;
      });
      if(!match) return false;
    }
    if(poolUI.types.length&&poolUI.types.indexOf(typeLabel(c))<0) return false;
    return true;
  });
}
function poolSorted(arr){
  const keys=poolUI.sorts;
  return arr.slice().sort((a,b)=>{
    for(const k of keys){
      const va=sortVal(a,k), vb=sortVal(b,k);
      if(va<vb) return -1;
      if(va>vb) return 1;
    }
    return a.n.localeCompare(b.n);
  });
}
function poolRowHTML(c){
  return '<div class="prow"><span class="pname">'+esc(c.n)+' <span style="color:var(--dim);font-size:.8rem">· MV '+cmc(c)+' · '+typeLabel(c)+' · '+cardRole(c)+'</span></span><span class="pgrade">'+esc(c.g)+'</span></div>';
}
function poolControlsHTML(pool){
  const typeSet=[]; pool.forEach(c=>{ const t=typeLabel(c); if(typeSet.indexOf(t)<0) typeSet.push(t); });
  let h='<div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px">';
  h+='<span style="color:var(--dim);font-size:.82rem;align-self:center">Sort by:</span>';
  SORT_KEYS.forEach(([k,label])=>{
    const i=poolUI.sorts.indexOf(k);
    h+='<button style="padding:5px 11px;font-size:.82rem;'+(i>=0?'background:#1f6feb;border-color:#1f6feb':'')+'" onclick="poolUIAct(\'sort\',\''+k+'\')">'+label+(i>=0?' '+(i+1):'')+'</button>';
  });
  h+='</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px">';
  h+='<span style="color:var(--dim);font-size:.82rem;align-self:center">Colors:</span>';
  GROUP_ORDER.forEach(g=>{
    if(!pool.some(c=>colorGroup(c)===g)) return;
    const on=poolUI.colors.indexOf(g)>=0;
    h+='<button style="padding:5px 11px;font-size:.82rem;'+(on?'background:#1f6feb;border-color:#1f6feb':'')+'" onclick="poolUIAct(\'color\',\''+g+'\')">'+g+'</button>';
  });
  h+='</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px">';
  h+='<span style="color:var(--dim);font-size:.82rem;align-self:center">Types:</span>';
  typeSet.forEach(t=>{
    const on=poolUI.types.indexOf(t)>=0;
    h+='<button style="padding:5px 11px;font-size:.82rem;'+(on?'background:#1f6feb;border-color:#1f6feb':'')+'" onclick="poolUIAct(\'type\',\''+t+'\')">'+t+'</button>';
  });
  const active=poolUI.sorts.length||poolUI.colors.length||poolUI.types.length;
  h+='<button style="padding:5px 11px;font-size:.82rem;'+(active?'background:#3d1f22;border-color:#e6484d':'opacity:.55')+'" onclick="poolUIAct(\'clear\',\'\')">Clear — show whole pool</button>';
  h+='</div>';
  return h;
}
function poolListHTML(pool){
  const arr=poolFiltered(pool);
  if(poolUI.sorts.length){
    if(!arr.length) return '<p class="suggest">No cards match those filters.</p>';
    return '<p class="suggest" style="margin:0 0 6px">Showing '+arr.length+' of '+pool.length+' cards · sorted by '+poolUI.sorts.map(k=>SORT_KEYS.filter(s=>s[0]===k)[0][1]).join(' → ')+'</p>'
      +poolSorted(arr).map(poolRowHTML).join('');
  }
  const groups={};
  arr.forEach(c=>{ const g=colorGroup(c); (groups[g]=groups[g]||[]).push(c); });
  let html='';
  if(poolUI.colors.length||poolUI.types.length) html+='<p class="suggest" style="margin:0 0 6px">Showing '+arr.length+' of '+pool.length+' cards (filtered)</p>';
  GROUP_ORDER.forEach(g=>{
    const garr=(groups[g]||[]).sort((a,b)=>(GRADE_VAL[b.g]||0)-(GRADE_VAL[a.g]||0));
    if(!garr.length) return;
    html+='<h3>'+g+' ('+garr.length+')</h3>'+garr.map(poolRowHTML).join('');
  });
  return html||'<p class="suggest">No cards match those filters.</p>';
}
function poolHTML(pool){
  if(!pool.length) return '<p class="suggest">No cards yet.</p>';
  return poolControlsHTML(pool)+'<div class="poolList">'+poolListHTML(pool)+'</div>';
}
function poolUIAct(kind,val){
  function toggle(arr,v){ const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); }
  if(kind==='sort') toggle(poolUI.sorts,val);
  else if(kind==='color') toggle(poolUI.colors,val);
  else if(kind==='type') toggle(poolUI.types,val);
  else if(kind==='clear'){ poolUI.sorts=[]; poolUI.colors=[]; poolUI.types=[]; }
  if(poolOpen) renderPoolView();
  const r=document.getElementById('results');
  if(r&&(r.className||'').indexOf('show')>=0){
    const host=r.querySelector('.poolHost');
    if(host) host.innerHTML=poolHTML(seats[0].pool);
  }
}
function renderPoolView(){
  document.getElementById('poolview').innerHTML='<h3 style="margin-top:0">My pool</h3>'+poolHTML(seats[0].pool);
}
document.getElementById('poolBtn').addEventListener('click',()=>{
  poolOpen=!poolOpen;
  document.getElementById('poolview').className='poolview'+(poolOpen?' show':'');
  if(poolOpen) renderPoolView();
});
function endDraft(){
  document.getElementById('grid').innerHTML='';
  document.getElementById('hint').textContent='Draft complete! Here is your report card, your pool, and how the AI seats ended up.';
  document.getElementById('dir').textContent='';
  const me=seats[0].pool;
  const myColors=aiColors(me).map(x=>COLOR_NAME[x]);
  const playables=me.filter(c=>(GRADE_VAL[c.g]||0)>=3).length;
  // draft report card
  const avg=picks.reduce((a,p)=>a+p.score,0)/Math.max(1,picks.length);
  const overall=scoreToLetter(avg);
  const bestTaken=picks.filter(p=>p.diff===0).length;
  let html='<h2>Draft report — <span style="color:var(--gold)">'+overall+'</span></h2>'
    +'<p class="suggest">You took the best card for your pool — raw power discounted for the colors and pips you could actually pay at that point — on '+bestTaken+' of '+picks.length+' picks.</p>';
  [1,2,3].forEach(pn=>{
    html+='<h3>Pack '+pn+'</h3>';
    picks.filter(p=>p.packNo===pn).forEach(p=>{
      html+='<div class="prow"><span class="pname">P'+p.pickNo+' — '+esc(p.card.n)+'</span><span class="pgrade">'+p.letter+'</span></div>';
      if(p.letter.charAt(0)!=='A') html+='<div class="pnote">'+p.notes.map(esc).join(' ')+'</div>';
    });
  });
  html+='<h2 style="margin-top:22px">Your pool \u2014 '+me.length+' cards</h2>'
    +'<p class="suggest">Suggested colors: <b>'+(myColors.join(' / ')||'—')+'</b> \u00B7 '+playables+' playables (C- or better)</p>'
    +'<div class="poolHost">'+poolHTML(me)+'</div>'
    +'<h2 style="margin-top:22px">AI seats</h2>'
    +'<table class="stable"><tr><th>Seat</th><th>Colors</th><th>Playables</th></tr>';
  for(let i=1;i<SEATS;i++){
    const cols=aiColors(seats[i].pool).map(x=>COLOR_NAME[x]).join(' / ');
    const pl=seats[i].pool.filter(c=>(GRADE_VAL[c.g]||0)>=3).length;
    html+='<tr><td>'+(i+1)+'</td><td>'+cols+'</td><td>'+pl+'</td></tr>';
  }
  html+='</table><div class="controls"><button class="primary" id="againBtn">Draft again</button></div>';
  const r=document.getElementById('results');
  r.innerHTML=html; r.className='results show';
  document.getElementById('againBtn').addEventListener('click',newDraft);
  renderAll();
}
newDraft();
</script>
</body>
</html>
