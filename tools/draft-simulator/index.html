<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reality Fracture Draft Simulator</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3342;
  --txt:#e8edf3; --dim:#9aa7b8; --acc:#7ee787; --gold:#f0b429;
  --r-m:#e6484d; --r-r:#c9a227; --r-u:#8fa3bf; --r-c:#6e7681;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.topbar h1{font-size:1.35rem;margin:0}
.topbar h1 small{display:block;font-size:.8rem;color:var(--dim);font-weight:400}
.stats{display:flex;gap:10px;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
.pill b{color:var(--gold)}
.hint{color:var(--dim);font-size:.9rem;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.card:hover{transform:translateY(-2px);border-color:#4a5a75}
.card.picked{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.card .cname{font-weight:600;font-size:.92rem;line-height:1.25;min-height:2.4em}
.card .ccost{margin:6px 0;display:flex;flex-wrap:wrap;gap:2px;align-items:center;min-height:20px}
.card .ccost img{width:19px;height:19px}
.card .ctype{font-size:.78rem;color:var(--dim);margin-bottom:8px}
.rar{position:absolute;top:8px;right:8px;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.04em}
.rar.M{background:#3d1f22;color:var(--r-m);border:1px solid var(--r-m)}
.rar.R{background:#38300f;color:var(--r-r);border:1px solid var(--r-r)}
.rar.U{background:#232c3b;color:var(--r-u);border:1px solid var(--r-u)}
.rar.C{background:#22262c;color:var(--r-c);border:1px solid var(--r-c)}
.grade{display:none;font-size:.72rem;font-weight:700;margin-top:6px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.revealed .grade{display:inline-block}
.revealed .card.best{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.revealed .card{cursor:default}
.revealed .card:hover{transform:none}
.verdict{margin:16px 0;padding:14px 16px;border-radius:10px;font-size:1.02rem;display:none}
.verdict.show{display:block}
.verdict.good{background:#12281a;border:1px solid #2f7a44}
.verdict.bad{background:#2b1416;border:1px solid #8a3033}
.verdict .why{color:var(--dim);font-size:.9rem;margin-top:6px}
.controls{margin-top:14px;display:flex;gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:11px 20px;font-size:1rem;font-weight:600}
button.primary{background:#1f6feb;border-color:#1f6feb}
button.primary:hover{background:#2b7fff}
button:disabled{opacity:.5;cursor:default}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:380px;width:100%;padding:16px;text-align:center;max-height:92vh;overflow:auto}
.sheet img{width:100%;border-radius:10px}
.sheet .fallback{padding:30px 10px;text-align:left;font-size:.9rem;color:var(--dim);white-space:pre-wrap}
.sheet h3{margin:10px 0 4px;font-size:1.05rem}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet .row button{flex:1}
/* results */
.results{display:none;text-align:center;padding:40px 10px}
.results.show{display:block}
.results .big{font-size:3rem;font-weight:800;color:var(--gold)}
.results .tier{font-size:1.3rem;margin:10px 0;color:var(--acc)}
.results p{color:var(--dim)}
a.home{color:var(--dim);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Reality Fracture Draft Simulator<small>Pick the best card in each pack — 50 packs</small></h1>
    <div class="stats">
      <div class="pill">Pack <b id="packNum">1</b> / 50</div>
      <div class="pill">Score <b id="score">0</b></div>
    </div>
  </div>
  <div class="hint" id="hint">Tap a card to preview it, then pick. Grades are hidden until you lock in.</div>
  <div class="grid" id="grid"></div>
  <div class="verdict" id="verdict"></div>
  <div class="controls"><button class="primary" id="nextBtn" style="display:none">Next Pack →</button></div>
  <div class="results" id="results"></div>
  <p style="margin-top:30px"><a class="home" href="../../">← Back to wesward</a></p>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div id="modalBody"></div>
    <h3 id="modalName"></h3>
    <div class="row">
      <button id="cancelBtn">Look more</button>
      <button class="primary" id="pickBtn">Pick this card</button>
    </div>
  </div>
</div>

:"Artifact Creature 0/4","r":"C","g":"C","note":"0/4 with expensive tuck; too slow.","img":"https://cards.scryfall.io/normal/front/5/d/5d4a8e5f-0024-4da3-a2f5-edb48b12e733.jpg?1789556949"},{"n":"Medic's Kitesail","c":"{2}","t":"Artifact","r":"C","g":"C+","note":"Flying equipment; fine.","img":"https://cards.scryfall.io/normal/front/8/b/8b07409a-1dce-461d-95e4-1130521ff4c4.jpg?1789556945"},{"n":"Keeper of the Quiet Hour","c":"{3}","t":"Artifact Creature 3/2","r":"C","g":"C+","note":"3/2 that empowers; filler.","img":"https://cards.scryfall.io/normal/front/b/6/b6331218-dbb8-44a9-8ba5-5fb1ab41c5c0.jpg?1788878239"},{"n":"Murmuring Volume","c":"{3}","t":"Artifact","r":"C","g":"B-","note":"Mana rock with loot; fine.","img":"https://cards.scryfall.io/normal/front/d/6/d68eab2e-89dd-4377-b7af-01512b1804a0.jpg?1789385977"}];

<script>
const GRADE_VAL = {'S':12,'A+':11,'A':10,'A-':9,'B+':8,'B':7,'B-':6,'C+':5,'C':4,'C-':3,'D+':2,'D':1,'F':0};
const POOL = {M:[],R:[],U:[],C:[]};
CARDS.forEach(c=>{ if(POOL[c.r]) POOL[c.r].push(c); });
const W = {M:0.03,R:0.12,U:0.30,C:0.55};

let packIdx=0, score=0, currentPack=[], locked=false, modalCard=null;

function manaHTML(cost){
  if(!cost) return '<span style="color:var(--dim);font-size:.8rem">land</span>';
  return cost.replace(/\{([^}]+)\}/g,(m,s)=>{
    const sym = s.replace('/','');
    return '<img src="https://svgs.scryfall.io/card-symbols/'+encodeURIComponent(sym)+'.svg" alt="'+s+'" loading="lazy">';
  });
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function drawPack(){
  const size = 5 + Math.floor(Math.random()*11); // 5..15
  const pack=[]; const used=new Set();
  let guard=0;
  while(pack.length<size && guard++<500){
    const roll=Math.random(); let r='C';
    if(roll<W.M) r='M'; else if(roll<W.M+W.R) r='R'; else if(roll<W.M+W.R+W.U) r='U';
    let pool=POOL[r]; if(!pool.length) pool=POOL.C;
    const c=pool[Math.floor(Math.random()*pool.length)];
    if(used.has(c.n)) continue;
    used.add(c.n); pack.push(c);
  }
  return pack;
}

function renderPack(){
  locked=false;
  const grid=document.getElementById('grid');
  grid.classList.remove('revealed');
  grid.innerHTML='';
  document.getElementById('verdict').className='verdict';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('results').className='results';
  currentPack=drawPack();
  currentPack.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='card'; d.dataset.idx=i;
    d.innerHTML='<span class="rar '+c.r+'">'+c.r+'</span>'
      +'<div class="cname">'+esc(c.n)+'</div>'
      +'<div class="ccost">'+manaHTML(c.c)+'</div>'
      +'<div class="ctype">'+esc(c.t)+'</div>'
      +'<span class="grade">Grade: '+esc(c.g)+'</span>';
    d.addEventListener('click',()=>openModal(c,d));
    grid.appendChild(d);
  });
  document.getElementById('packNum').textContent=packIdx+1;
  document.getElementById('hint').textContent='Tap a card to preview it, then pick. Grades are hidden until you lock in.';
}

function openModal(c,el){
  if(locked) return;
  modalCard={c:c,el:el};
  document.getElementById('modalName').textContent=c.n;
  const body=document.getElementById('modalBody');
  body.innerHTML='<img src="'+c.img+'" alt="'+esc(c.n)+'" onerror="this.outerHTML=\'<div class=&quot;fallback&quot;>'+esc(c.n)+'</div>\'">';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }

document.getElementById('cancelBtn').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

document.getElementById('pickBtn').addEventListener('click',()=>{
  if(!modalCard||locked) return;
  closeModal();
  locked=true;
  const {c,el}=modalCard;
  el.classList.add('picked');
  // find best
  let best=currentPack[0];
  currentPack.forEach(x=>{ if((GRADE_VAL[x.g]||0)>(GRADE_VAL[best.g]||0)) best=x; });
  const correct=(GRADE_VAL[c.g]||0)>=(GRADE_VAL[best.g]||0);
  if(correct) score++;
  document.getElementById('score').textContent=score;
  document.getElementById('grid').classList.add('revealed');
  document.querySelectorAll('.card').forEach(d=>{
    if(currentPack[+d.dataset.idx]===best) d.classList.add('best');
  });
  const v=document.getElementById('verdict');
  v.className='verdict show '+(correct?'good':'bad');
  v.innerHTML=(correct
    ? '✅ <b>Correct!</b> '+esc(c.n)+' ('+esc(c.g)+') was the best pick in this pack.'
    : '❌ <b>Not quite.</b> The best pick was <b>'+esc(best.n)+'</b> ('+esc(best.g)+').')
    +'<div class="why">'+esc(best.note||'')+'</div>';
  document.getElementById('hint').textContent='Pack revealed. Grades shown — gold border marks the best pick.';
  const nb=document.getElementById('nextBtn');
  nb.style.display='inline-block';
  nb.textContent = packIdx>=49 ? 'See Results →' : 'Next Pack →';
});

document.getElementById('nextBtn').addEventListener('click',()=>{
  packIdx++;
  if(packIdx>=50){ showResults(); return; }
  renderPack();
  window.scrollTo({top:0,behavior:'smooth'});
});

function showResults(){
  document.getElementById('grid').innerHTML='';
  document.getElementById('verdict').className='verdict';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('hint').textContent='';
  const pct=Math.round(score/50*100);
  let tier='Learning the format';
  if(score>=45) tier='Mythic Drafter 🏆';
  else if(score>=38) tier='Diamond Drafter 💎';
  else if(score>=30) tier='Platinum Drafter';
  else if(score>=22) tier='Gold Drafter';
  else if(score>=15) tier='Silver Drafter';
  const r=document.getElementById('results');
  r.className='results show';
  r.innerHTML='<div class="big">'+score+' / 50</div>'
    +'<div class="tier">'+tier+'</div>'
    +'<p>'+pct+'% pick accuracy on Reality Fracture packs.</p>'
    +'<button class="primary" id="againBtn">Run It Back</button>';
  document.getElementById('againBtn').addEventListener('click',()=>{
    packIdx=0; score=0;
    document.getElementById('score').textContent='0';
    renderPack();
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

renderPack();
</script>
