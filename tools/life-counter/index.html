<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#101416" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <title>Life Counter</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink:#f8faf9; --muted:rgba(255,255,255,.68); --line:rgba(255,255,255,.15);
      --surface:#101416; --sheet:#171d20; --button:rgba(0,0,0,.24); --shadow:rgba(0,0,0,.48);
      --focus:#ffffff;
    }
    @media (prefers-color-scheme: light) {
      :root { --ink:#fff; --muted:rgba(255,255,255,.76); --surface:#eef1ef; --sheet:#f9faf9; --button:rgba(0,0,0,.19); --shadow:rgba(14,21,19,.32); }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--surface); }
    body { font-family:"Archivo Narrow", ui-sans-serif, system-ui, sans-serif; color:var(--ink); overscroll-behavior:none; }
    button, input { font:inherit; }
    button { color:inherit; }
    button:focus-visible, input:focus-visible { outline:3px solid var(--focus); outline-offset:-3px; }
    .board { position:fixed; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; column-gap:2px; row-gap:50px; background:#090b0c; }
    .player { position:relative; min-width:0; min-height:0; overflow:hidden; isolation:isolate; background:var(--tone); }
    .player::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(145deg, rgba(255,255,255,.09), transparent 42%, rgba(0,0,0,.2)); }
    .player[data-i="0"] { --tone:#9f2f29; }
    .player[data-i="1"] { --tone:#23617a; }
    .player[data-i="2"] { --tone:#4a6d32; }
    .player[data-i="3"] { --tone:#76522b; }
    .player-inner { width:100%; height:100%; padding:max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); display:grid; grid-template-rows:auto 1fr auto; }
    .tabletop .player:nth-child(-n+2) .player-inner { transform:rotate(180deg); }
    .player-head { min-width:0; display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .name { border:0; background:transparent; padding:5px 4px; max-width:calc(100% - 38px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; font-weight:700; letter-spacing:.045em; font-size:clamp(15px, 4vw, 21px); text-shadow:0 1px 2px rgba(0,0,0,.3); }
    .details { border:1px solid var(--line); background:rgba(0,0,0,.16); width:34px; height:30px; border-radius:9px; font-family:"IBM Plex Mono", monospace; font-size:14px; line-height:1; overflow:hidden; }
    .life-row { min-height:0; display:grid; grid-template-columns:minmax(44px, .65fr) minmax(68px, 1.2fr) minmax(44px, .65fr); align-items:center; gap:3px; }
    .life-btn { border:0; background:transparent; height:100%; min-height:64px; padding:0; font-family:"IBM Plex Mono", monospace; font-size:clamp(35px, 10vw, 62px); font-weight:500; opacity:.86; touch-action:manipulation; }
    .life-btn:active { background:rgba(0,0,0,.12); opacity:1; }
    .life { font-family:"IBM Plex Mono", monospace; font-size:clamp(64px, 20vw, 122px); font-weight:600; line-height:.8; letter-spacing:-.09em; text-align:center; text-shadow:0 3px 2px rgba(0,0,0,.22); font-variant-numeric:tabular-nums; }
    .status { display:grid; grid-template-columns:40px 1fr 40px; align-items:center; gap:5px; }
    .jump { border:1px solid var(--line); background:var(--button); min-height:32px; border-radius:9px; font-family:"IBM Plex Mono", monospace; font-size:14px; font-weight:600; touch-action:manipulation; }
    .jump:active { background:rgba(0,0,0,.35); }
    .trackers { min-width:0; border:0; background:rgba(0,0,0,.13); border-radius:9px; min-height:32px; padding:2px 5px; display:flex; align-items:center; justify-content:center; gap:7px; font-family:"IBM Plex Mono", monospace; font-size:clamp(10px, 2.8vw, 13px); overflow:hidden; white-space:nowrap; }
    .trackers span { display:inline-flex; align-items:center; gap:3px; }
    .trackers svg { width:12px; height:12px; flex:none; fill:currentColor; opacity:.78; }
    .toolbar { position:fixed; z-index:10; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; gap:3px; padding:4px; border:1px solid rgba(255,255,255,.12); border-radius:14px; background:#101416; box-shadow:0 5px 20px var(--shadow); }
    .tool { width:42px; height:34px; border:0; border-radius:10px; background:transparent; color:#f6f8f7; display:grid; place-items:center; touch-action:manipulation; }
    .tool:active { background:rgba(255,255,255,.12); }
    .tool[disabled] { opacity:.32; }
    .tool svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .hurry { width:102px; height:34px; border:0; border-radius:10px; background:#c92f27; color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; padding:0 10px; font-size:14px; font-weight:700; letter-spacing:.035em; white-space:nowrap; box-shadow:inset 0 -2px 0 rgba(0,0,0,.24); touch-action:manipulation; }
    .hurry:active { background:#9f211c; transform:translateY(1px); box-shadow:none; }
    .hurry svg { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    @media (max-width:350px) {
      .toolbar { gap:2px; padding:3px; }
      .tool { width:36px; }
      .hurry { width:91px; padding:0 6px; font-size:12px; gap:4px; }
      .hurry svg { width:16px; height:16px; }
    }
    #sound .mute-slash { display:none; }
    #sound[aria-pressed="true"] .sound-waves { display:none; }
    #sound[aria-pressed="true"] .mute-slash { display:block; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

    .shade { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.62); opacity:0; pointer-events:none; transition:opacity .16s ease; }
    .shade.open { opacity:1; pointer-events:auto; }
    .sheet { position:absolute; left:50%; bottom:0; transform:translate(-50%, 105%); width:min(100%, 520px); max-height:min(88dvh, 720px); overflow:auto; background:var(--sheet); color:light-dark(#18201c,#f4f7f5); border-radius:22px 22px 0 0; padding:10px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.35); transition:transform .2s ease; }
    .shade.open .sheet { transform:translate(-50%, 0); }
    .grab { width:44px; height:5px; margin:0 auto 15px; border-radius:5px; background:light-dark(#c0c8c3,#45504a); }
    .sheet-head { display:flex; gap:10px; align-items:center; }
    .player-name-input { min-width:0; flex:1; border:1px solid light-dark(#cbd2ce,#3b4741); border-radius:10px; background:light-dark(#fff,#202824); color:inherit; padding:9px 11px; font-size:21px; font-weight:700; }
    .close { border:0; background:light-dark(#e8ece9,#29332e); color:inherit; width:40px; height:40px; border-radius:50%; font-size:25px; line-height:1; }
    .section-title { margin:19px 0 8px; font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:light-dark(#4c5d54,#aab7b0); }
    .counter-row { display:grid; grid-template-columns:1fr 52px 70px 52px; gap:7px; align-items:center; min-height:52px; }
    .counter-row + .counter-row { border-top:1px solid light-dark(#d8ddda,#303a35); }
    .counter-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:18px; font-weight:600; }
    .counter-value { text-align:center; font-family:"IBM Plex Mono", monospace; font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
    .count-btn { border:0; border-radius:11px; background:light-dark(#e5ebe7,#26312b); color:inherit; height:42px; font-family:"IBM Plex Mono",monospace; font-size:25px; }
    .danger-note { margin:12px 0 0; color:light-dark(#69776f,#93a39a); font-size:14px; line-height:1.35; }
    .confirm { padding:12px 4px 4px; }
    .confirm h2 { margin:0 0 7px; font-size:25px; }
    .confirm p { margin:0 0 18px; color:light-dark(#58685f,#acb8b1); font-size:17px; line-height:1.35; }
    .confirm-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .confirm-actions button { border:0; border-radius:12px; height:48px; background:light-dark(#e5eae7,#2a342f); color:inherit; font-size:18px; font-weight:700; }
    .confirm-actions .reset-yes { background:#b73830; color:#fff; }
    .dead { filter:saturate(.35) brightness(.62); }
    .dead .life { color:#ffddd9; }
    .tablet-stats, .game-hud { display:none; }

    @media (min-width:768px) and (min-height:650px) {
      .board { inset:12px 12px 132px; gap:8px; background:transparent; }
      .player { border-radius:18px; box-shadow:0 3px 16px rgba(0,0,0,.22); }
      .player-inner { padding:14px 16px; grid-template-rows:auto minmax(95px,.82fr) auto; }
      .name { font-size:23px; }
      .details { width:38px; height:34px; }
      .life-row { grid-template-columns:minmax(68px,.55fr) minmax(110px,1.25fr) minmax(68px,.55fr); }
      .life { font-size:clamp(82px,13vw,128px); }
      .life-btn { font-size:58px; }
      .status { display:none; }
      .tablet-stats { display:grid; grid-template-columns:minmax(120px,.7fr) minmax(250px,1.8fr); gap:10px; align-items:stretch; }
      .stat-block { border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.14); border-radius:12px; padding:8px; min-width:0; }
      .stat-title { display:block; margin:0 0 5px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.72); }
      .stat-controls { display:grid; grid-template-columns:34px 1fr 34px; gap:4px; align-items:center; }
      .mini-btn { border:0; height:34px; border-radius:8px; background:rgba(0,0,0,.22); color:#fff; font:600 19px/1 "IBM Plex Mono",monospace; }
      .mini-value { text-align:center; font:600 23px/1 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
      .cmd-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
      .cmd-source { min-width:0; }
      .cmd-label { display:block; margin-bottom:3px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; text-align:center; font-size:12px; color:rgba(255,255,255,.78); }
      .cmd-source .stat-controls { grid-template-columns:28px 1fr 28px; }
      .cmd-source .mini-btn { height:30px; font-size:16px; }
      .cmd-source .mini-value { font-size:19px; }
      .toolbar { top:auto; bottom:145px; transform:translateX(-50%); }
      .game-hud { position:fixed; z-index:5; left:12px; right:12px; bottom:max(10px,env(safe-area-inset-bottom)); height:110px; display:grid; grid-template-columns:240px 1fr; gap:12px; color:light-dark(#1b231f,#f2f6f4); }
      .turn-card, .log-card { border:1px solid light-dark(#d1d8d4,#303b36); background:light-dark(#f7f9f8,#18201c); border-radius:16px; padding:12px 14px; overflow:hidden; }
      .hud-label { margin:0 0 4px; font-size:11px; letter-spacing:.09em; font-weight:700; text-transform:uppercase; color:light-dark(#5a6961,#9aaba2); }
      .turn-line { display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .turn-player { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:24px; font-weight:700; }
      .turn-next { border:0; border-radius:10px; background:light-dark(#dfe7e2,#2b3831); color:inherit; padding:10px 14px; font-weight:700; }
      .round { margin-top:3px; font:500 13px "IBM Plex Mono",monospace; color:light-dark(#617067,#95a69d); }
      .event-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px 14px; margin:0; padding:0; list-style:none; }
      .event-list li { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:500 12px/1.45 "IBM Plex Mono",monospace; color:light-dark(#3f4d45,#c1cbc5); }
      .active-turn::after { content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 4px rgba(255,255,255,.72); border-radius:inherit; }
    }
    @media (min-width:1100px) and (min-height:650px) {
      .board { right:312px; bottom:12px; }
      .game-hud { left:auto; top:12px; right:12px; bottom:12px; width:284px; height:auto; grid-template-columns:1fr; grid-template-rows:auto 1fr; }
      .toolbar { left:auto; right:316px; top:50%; bottom:auto; transform:translateY(-50%); flex-direction:column; }
      .event-list { grid-template-columns:1fr; gap:5px; }
      .event-list li { white-space:normal; }
      .log-card { padding-top:16px; }
      .tablet-stats { grid-template-columns:112px 1fr; }
    }
    @media (max-height:560px) and (orientation:landscape) {
      .board { column-gap:42px; row-gap:2px; }
      .name { font-size:14px; } .details { height:26px; } .status { display:none; }
      .life { font-size:clamp(50px,15vh,82px); } .life-btn { min-height:40px; font-size:40px; }
      .toolbar { flex-direction:column; } .tool { width:34px; height:30px; }
    }
    @media (prefers-reduced-motion:reduce) { .shade, .sheet { transition:none; } }
  </style>
</head>
<body class="tabletop">
  <main class="board" id="board" aria-label="Four player Magic life counter"></main>
  <nav class="toolbar" aria-label="Game controls">
    <button class="tool" id="undo" aria-label="Undo last change" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M5 12h9a6 6 0 0 1 6 6"/></svg>
    </button>
    <button class="tool" id="rotate" aria-label="Toggle tabletop orientation" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.3-2.1L20 8M4 16l2.6 2.1A7 7 0 0 0 17.9 16"/></svg>
    </button>
    <button class="tool" id="awake" aria-label="Keep screen awake" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
    <button class="tool" id="sound" aria-label="Mute sounds" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><g class="sound-waves"><path d="M15 9a4 4 0 0 1 0 6"/><path d="M18 6a8 8 0 0 1 0 12"/></g><path class="mute-slash" d="m15 9 6 6M21 9l-6 6"/></svg>
    </button>
    <button class="hurry" id="hurry" aria-label="Say hurry up motherfucker out loud">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6M9 6v12M13 4v16M17 7v10M21 10v4"/></svg>
      <span>HURRY UP!</span>
    </button>
    <button class="tool" id="reset" aria-label="Start a new game">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </nav>

  <aside class="game-hud" aria-label="Turn tracker and game event log">
    <section class="turn-card">
      <p class="hud-label">Current turn</p>
      <div class="turn-line"><strong class="turn-player" id="turnPlayer">Player 1</strong><button class="turn-next" id="nextTurn">Next turn</button></div>
      <div class="round" id="roundLabel">Round 1 · Turn 1 of 4</div>
    </section>
    <section class="log-card">
      <p class="hud-label">Game log</p>
      <ol class="event-list" id="eventList"><li>Game ready · 40 life</li></ol>
    </section>
  </aside>

  <div class="shade" id="shade" aria-hidden="true">
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
  </div>

  <script>
    (function(){
      'use strict';
      var players = [0,1,2,3].map(function(i){ return { name:'Player '+(i+1), life:40, poison:0, commander:[0,0,0] }; });
      var history = [], events = ['Game ready · 40 life'], turn = 0, round = 1, active = null, wakeLock = null;
      var audioContext = null, muted = false;
      var board = document.getElementById('board');
      var shade = document.getElementById('shade');
      var sheet = document.getElementById('sheet');
      var undoBtn = document.getElementById('undo');
      var poisonIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c3.5 0 6.5 2.6 6.5 6 0 2.1-1.1 3.9-2.8 5v2.5h-2V13h-3.4v2.5h-2V13a5.9 5.9 0 0 1-2.8-5c0-3.4 3-6 6.5-6Zm-2.7 6.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Zm5.4 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6ZM9 18h6v2H9v-2Z"/></svg>';
      var cmdIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 8 4v5c0 5.2-3.4 9.7-8 11-4.6-1.3-8-5.8-8-11V6l8-4Zm0 3.1L7 7.6V11c0 3.6 2.1 6.8 5 7.9 2.9-1.1 5-4.3 5-7.9V7.6l-5-2.5Z"/></svg>';

      function render(){
        board.innerHTML = players.map(function(p,i){
          var totalCmd = Math.max.apply(null,p.commander);
          var others=otherPlayers(i);
          var commanderMatrix=others.map(function(opp,slot){ return '<div class="cmd-source"><span class="cmd-label">'+esc(players[opp].name)+'</span><div class="stat-controls"><button class="mini-btn" data-action="counter" data-type="commander" data-slot="'+slot+'" data-delta="-1" data-i="'+i+'" aria-label="Subtract commander damage from '+esc(players[opp].name)+'">−</button><output class="mini-value">'+p.commander[slot]+'</output><button class="mini-btn" data-action="counter" data-type="commander" data-slot="'+slot+'" data-delta="1" data-i="'+i+'" aria-label="Add commander damage from '+esc(players[opp].name)+'">+</button></div></div>'; }).join('');
          return '<section class="player '+(i===turn?'active-turn ':'')+((p.life<=0 || p.poison>=10 || totalCmd>=21)?'dead':'')+'" data-i="'+i+'" aria-label="'+esc(p.name)+', '+p.life+' life">'+
            '<div class="player-inner">'+
              '<header class="player-head"><button class="name" data-action="details" data-i="'+i+'">'+esc(p.name)+'</button><button class="details" data-action="details" data-i="'+i+'" aria-label="Edit '+esc(p.name)+' and damage counters">•••</button></header>'+
              '<div class="life-row"><button class="life-btn" data-action="life" data-delta="-1" data-i="'+i+'" aria-label="Subtract 1 life from '+esc(p.name)+'">−</button><output class="life" aria-live="polite">'+p.life+'</output><button class="life-btn" data-action="life" data-delta="1" data-i="'+i+'" aria-label="Add 1 life to '+esc(p.name)+'">+</button></div>'+
              '<footer class="status"><button class="jump" data-action="life" data-delta="-5" data-i="'+i+'" aria-label="Subtract 5 life">−5</button><button class="trackers" data-action="details" data-i="'+i+'" aria-label="Poison '+p.poison+', highest commander damage '+totalCmd+'"><span>'+poisonIcon+p.poison+'</span><span>'+cmdIcon+p.commander.join('·')+'</span></button><button class="jump" data-action="life" data-delta="5" data-i="'+i+'" aria-label="Add 5 life">+5</button></footer>'+
              '<div class="tablet-stats"><div class="stat-block"><span class="stat-title">Poison</span><div class="stat-controls"><button class="mini-btn" data-action="counter" data-type="poison" data-slot="0" data-delta="-1" data-i="'+i+'" aria-label="Subtract poison counter">−</button><output class="mini-value">'+p.poison+'</output><button class="mini-btn" data-action="counter" data-type="poison" data-slot="0" data-delta="1" data-i="'+i+'" aria-label="Add poison counter">+</button></div></div><div class="stat-block"><span class="stat-title">Commander damage</span><div class="cmd-grid">'+commanderMatrix+'</div></div></div>'+
            '</div></section>';
        }).join('');
        renderHud();
      }
      function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
      function snap(){ return JSON.stringify({players:players,events:events,turn:turn,round:round}); }
      function remember(){ history.push(snap()); if(history.length>60) history.shift(); undoBtn.disabled=false; }
      function addEvent(text){ events.unshift(text); if(events.length>18) events.length=18; }
      function renderHud(){
        var tp=document.getElementById('turnPlayer'), rl=document.getElementById('roundLabel'), list=document.getElementById('eventList');
        if(tp) tp.textContent=players[turn].name;
        if(rl) rl.textContent='Round '+round+' · Turn '+(turn+1)+' of 4';
        if(list) list.innerHTML=events.slice(0,9).map(function(item){return '<li>'+esc(item)+'</li>';}).join('');
      }
      function buzz(){ if(navigator.vibrate) navigator.vibrate(12); }
      function armAudio(){
        if(muted) return null;
        if(!audioContext){ var AudioCtor=window.AudioContext||window.webkitAudioContext; if(!AudioCtor)return null; audioContext=new AudioCtor(); }
        if(audioContext.state==='suspended') audioContext.resume();
        return audioContext;
      }
      function tone(kind){
        var ctx=armAudio(); if(!ctx || muted)return;
        var now=ctx.currentTime, osc=ctx.createOscillator(), gain=ctx.createGain();
        osc.type=kind==='life'?'sine':'triangle';
        osc.frequency.setValueAtTime(kind==='life'?760:250,now);
        osc.frequency.exponentialRampToValueAtTime(kind==='life'?520:155,now+(kind==='life'?.032:.07));
        gain.gain.setValueAtTime(0.0001,now);
        gain.gain.exponentialRampToValueAtTime(kind==='life'?.045:.07,now+.006);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+(kind==='life'?.04:.08));
        osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now+(kind==='life'?.045:.085));
      }
      function changeLife(i,d){ remember(); players[i].life += d; addEvent(players[i].name+' '+(d>0?'+':'')+d+' life → '+players[i].life); tone('life'); buzz(); render(); }
      function changeCounter(i,type,slot,d){
        remember();
        if(type==='poison'){ players[i].poison=Math.max(0,players[i].poison+d); addEvent(players[i].name+' poison → '+players[i].poison); }
        else { players[i].commander[slot]=Math.max(0,players[i].commander[slot]+d); var opp=otherPlayers(i)[slot]; addEvent(players[i].name+' commander from '+players[opp].name+' → '+players[i].commander[slot]); }
        tone('damage'); buzz(); render();
      }

      var holdTimer, holdLoop, held=false;
      board.addEventListener('pointerdown',function(e){
        var b=e.target.closest('[data-action="life"]'); if(!b) return;
        armAudio(); held=false; var i=+b.dataset.i, d=+b.dataset.delta;
        holdTimer=setTimeout(function(){ held=true; changeLife(i,d); holdLoop=setInterval(function(){ changeLife(i,d); },135); },480);
      });
      function stopHold(){ clearTimeout(holdTimer); clearInterval(holdLoop); }
      board.addEventListener('pointerup',stopHold); board.addEventListener('pointercancel',stopHold); board.addEventListener('pointerleave',stopHold);
      board.addEventListener('click',function(e){
        var b=e.target.closest('[data-action]'); if(!b) return;
        var i=+b.dataset.i;
        if(b.dataset.action==='life'){ if(!held) changeLife(i,+b.dataset.delta); held=false; }
        if(b.dataset.action==='counter') changeCounter(i,b.dataset.type,+b.dataset.slot,+b.dataset.delta);
        if(b.dataset.action==='details') openDetails(i);
      });

      function otherPlayers(i){ return [0,1,2,3].filter(function(x){return x!==i;}); }
      function openDetails(i){ active=i; var p=players[i], others=otherPlayers(i);
        sheet.innerHTML='<div class="grab"></div><div class="sheet-head"><label class="sr-only" for="pname">Player name</label><input id="pname" class="player-name-input" maxlength="18" value="'+esc(p.name)+'"><button class="close" data-close aria-label="Close">×</button></div>'+
          '<h2 class="section-title" id="sheetTitle">Poison counters</h2>'+counterRow('Poison',p.poison,'poison',0)+
          '<h2 class="section-title">Commander damage received</h2>'+others.map(function(opp,slot){ return counterRow('From '+players[opp].name,p.commander[slot],'commander',slot); }).join('')+
          '<p class="danger-note">10 poison counters or 21 combat damage from one commander loses the game.</p>';
        shade.classList.add('open'); shade.setAttribute('aria-hidden','false');
        setTimeout(function(){ document.getElementById('pname').focus(); document.getElementById('pname').select(); },120);
      }
      function counterRow(label,value,type,slot){ return '<div class="counter-row"><span class="counter-label">'+esc(label)+'</span><button class="count-btn" data-count="'+type+'" data-slot="'+slot+'" data-delta="-1" aria-label="Subtract one">−</button><output class="counter-value">'+value+'</output><button class="count-btn" data-count="'+type+'" data-slot="'+slot+'" data-delta="1" aria-label="Add one">+</button></div>'; }
      function closeSheet(){
        if(active!==null){ var input=document.getElementById('pname'); if(input){ var val=input.value.trim(); if(val && val!==players[active].name){ remember(); var old=players[active].name; players[active].name=val; addEvent(old+' renamed '+val); render(); } } }
        shade.classList.remove('open'); shade.setAttribute('aria-hidden','true'); active=null;
      }
      shade.addEventListener('click',function(e){ if(e.target===shade || e.target.closest('[data-close]')) closeSheet(); });
      sheet.addEventListener('click',function(e){
        var b=e.target.closest('[data-count]'); if(!b || active===null) return;
        var d=+b.dataset.delta, type=b.dataset.count, slot=+b.dataset.slot;
        var input=document.getElementById('pname'), name=input?input.value:players[active].name, who=active;
        changeCounter(who,type,slot,d); openDetails(who); document.getElementById('pname').value=name;
      });
      document.addEventListener('keydown',function(e){ if(e.key==='Escape' && shade.classList.contains('open')) closeSheet(); });

      undoBtn.addEventListener('click',function(){ if(!history.length)return; var state=JSON.parse(history.pop()); players=state.players; events=state.events; turn=state.turn; round=state.round; undoBtn.disabled=!history.length; buzz(); render(); });
      document.getElementById('rotate').addEventListener('click',function(){ var on=document.body.classList.toggle('tabletop'); this.setAttribute('aria-pressed',on?'true':'false'); });
      document.getElementById('sound').addEventListener('click',function(){
        muted=!muted; this.setAttribute('aria-pressed',muted?'true':'false'); this.setAttribute('aria-label',muted?'Unmute sounds':'Mute sounds');
        if(!muted){ armAudio(); tone('life'); }
      });
      document.getElementById('hurry').addEventListener('click',function(){
        if(!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance){
          this.disabled=true;
          this.querySelector('span').textContent='NO SPEECH';
          return;
        }
        window.speechSynthesis.cancel();
        var utterance=new SpeechSynthesisUtterance('hurry up motherfucker');
        window.speechSynthesis.speak(utterance);
        buzz();
      });
      document.getElementById('reset').addEventListener('click',function(){
        active=null; sheet.innerHTML='<div class="grab"></div><div class="confirm"><h2 id="sheetTitle">Start a new game?</h2><p>Life totals return to 40; poison counters and commander damage return to zero. Player names stay.</p><div class="confirm-actions"><button data-close>Keep playing</button><button class="reset-yes" data-reset-yes>New game</button></div></div>';
        shade.classList.add('open'); shade.setAttribute('aria-hidden','false');
      });
      sheet.addEventListener('click',function(e){ if(!e.target.closest('[data-reset-yes]'))return; remember(); players.forEach(function(p){p.life=40;p.poison=0;p.commander=[0,0,0];}); turn=0; round=1; events=['New game · 40 life']; shade.classList.remove('open'); shade.setAttribute('aria-hidden','true'); render(); buzz(); });
      document.getElementById('nextTurn').addEventListener('click',function(){
        remember(); turn=(turn+1)%4; if(turn===0) round++; addEvent('Turn → '+players[turn].name+' · round '+round); buzz(); render();
      });

      document.getElementById('awake').addEventListener('click',async function(){
        var btn=this;
        try {
          if(wakeLock){ await wakeLock.release(); wakeLock=null; btn.setAttribute('aria-pressed','false'); }
          else if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); btn.setAttribute('aria-pressed','true'); wakeLock.addEventListener('release',function(){wakeLock=null;btn.setAttribute('aria-pressed','false');}); }
          else { btn.setAttribute('aria-pressed','false'); }
        } catch(err){ btn.setAttribute('aria-pressed','false'); }
      });
      document.addEventListener('visibilitychange',async function(){
        var btn=document.getElementById('awake');
        if(document.visibilityState==='visible' && !wakeLock && btn.getAttribute('aria-pressed')==='true' && 'wakeLock' in navigator){ try{wakeLock=await navigator.wakeLock.request('screen');}catch(err){} }
      });
      render();
    })();
  </script>
</body>
</html>
