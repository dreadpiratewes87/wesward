<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#101416" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <title>Life Counter</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2" />
  <style>
    :root {
      color-scheme: dark;
      --ink:#f2f4f8; --muted:rgba(255,255,255,.62); --line:rgba(255,255,255,.14);
      --surface:#050607; --sheet:#0c0e11; --button:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.7);
      --focus:#ffffff;
      --chrome-hi:rgba(255,255,255,.14); --chrome-lo:rgba(0,0,0,.55);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--surface); }
    body { font-family:"Archivo Narrow", ui-sans-serif, system-ui, sans-serif; color:var(--ink); overscroll-behavior:none; }
    button, input { font:inherit; }
    button { color:inherit; }
    button:focus-visible, input:focus-visible { outline:3px solid var(--focus); outline-offset:-3px; }
    .board { position:fixed; inset:60px 0 78px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; column-gap:2px; row-gap:50px; background:#000; }
    .player { position:relative; min-width:0; min-height:0; overflow:hidden; isolation:isolate;
      background:linear-gradient(160deg,#171a1e 0%,#0a0c0e 55%,#050607 100%);
      border-radius:14px; margin:5px;
      /* 3D chrome bevel */
      box-shadow:inset 0 1px 0 var(--chrome-hi), inset 0 -2px 6px var(--chrome-lo),
        inset 2px 0 4px rgba(0,0,0,.4), inset -2px 0 4px rgba(0,0,0,.4),
        0 4px 18px rgba(0,0,0,.6),
        0 0 18px var(--neon), 0 0 42px var(--neon-dim);
      border:1px solid var(--neon-border);
    }
    .player::before { content:""; position:absolute; inset:0; z-index:-1;
      background:linear-gradient(145deg, rgba(255,255,255,.07), transparent 40%, rgba(0,0,0,.35));
      border-radius:14px; pointer-events:none; }
    .player::after { content:""; position:absolute; inset:0; z-index:1; pointer-events:none; border-radius:14px;
      background:
        linear-gradient(165deg, var(--neon-sheen) 0%, transparent 45%),
        radial-gradient(130% 100% at 50% 0%, var(--neon-wash), transparent 60%); }
    /* neon colors set dynamically via JS per playerMana */
    .player-inner { width:100%; height:100%; padding:max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); display:grid; grid-template-columns:minmax(50px,.55fr) minmax(0,1fr) minmax(50px,.55fr); grid-template-rows:minmax(0,1fr) auto; column-gap:6px; transition:transform .25s ease; }
    .tile-center { grid-row:1; min-width:0; min-height:0; display:grid; grid-template-rows:auto 1fr auto auto; }
    .life-zone { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; pointer-events:none; }
    .life-zone .life { pointer-events:auto; }
    .tap-hint { font-size:11px; font-weight:700; letter-spacing:.04em; color:rgba(255,255,255,.35); }
    /* per-tile rotate: flips this tile relative to the board's current orientation */
    .player.flipped .player-inner { transform:rotate(180deg); }
    .tabletop .player.flipped:nth-child(-n+2) .player-inner { transform:none; }
    .tabletop .board.stack2 .player.flipped:nth-child(1) .player-inner { transform:rotate(180deg); }
    .tabletop .board.stack2 .player.flipped:nth-child(2) .player-inner { transform:none; }
    .tile-flip { border:1px solid rgba(255,255,255,.09); background:linear-gradient(180deg,#24272d,#101315); box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); width:34px; height:30px; border-radius:9px; display:grid; place-items:center; color:inherit; padding:0; touch-action:manipulation; }
    .tile-flip svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .tile-flip[aria-pressed="true"] { background:rgba(255,255,255,.22); }
    /* per-tile timer, bottom of each tile */
    .tile-timer { grid-column:1 / -1; grid-row:2; margin-top:6px; border:1px solid rgba(255,255,255,.08); background:linear-gradient(180deg,#22252a,#0e1013); box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.11); border-radius:16px; min-height:52px; padding:6px 12px; display:flex; align-items:center; justify-content:center; gap:8px; font-family:"IBM Plex Mono", monospace; font-size:20px; font-weight:600; color:inherit; width:100%; touch-action:manipulation; }
    .tile-timer svg { width:17px; height:17px; fill:currentColor; flex:none; opacity:.85; }
    .tile-timer .timer-dot { width:9px; height:9px; border-radius:50%; background:currentColor; opacity:.35; flex:none; }
    .tile-timer .ic-pause { display:none; }
    .tile-timer.running { background:linear-gradient(180deg,#2b3038,#13161b); }
    .tile-timer.running .ic-pause { display:block; }
    .tile-timer.running .ic-play { display:none; }
    .tile-timer.running .timer-dot { opacity:1; background:#30d158; box-shadow:0 0 6px #30d158; }
    .tabletop .player:nth-child(-n+2) .player-inner { transform:rotate(180deg); }
    /* 2-player portrait: stack full-width, player 1 near (bottom), player 2 far (top) */
    .board.stack2 .player:nth-child(1) { grid-row:2; }
    .board.stack2 .player:nth-child(2) { grid-row:1; }
    .tabletop .board.stack2 .player:nth-child(1) .player-inner { transform:none; }
    .tabletop .board.stack2 .player:nth-child(2) .player-inner { transform:rotate(180deg); }
    .player-head { min-width:0; display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .name { border:0; background:transparent; padding:5px 4px; min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; font-weight:700; letter-spacing:.045em; font-size:clamp(15px, 4vw, 21px); text-shadow:0 1px 2px rgba(0,0,0,.3); }
    .player-actions { display:flex; align-items:center; gap:5px; flex:none; }
    .player-hurry { border:0; border-radius:8px; background:#c92f27; color:#fff; height:30px; width:54px; padding:0 8px; font-size:11px; font-weight:700; letter-spacing:.045em; line-height:1; box-shadow:inset 0 -2px 0 rgba(0,0,0,.24); touch-action:manipulation; }
    .player-hurry:active { background:#9f211c; transform:translateY(1px); box-shadow:none; }
    .details { border:1px solid rgba(255,255,255,.09); background:linear-gradient(180deg,#24272d,#101315); box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); width:34px; height:30px; border-radius:9px; font-family:"IBM Plex Mono", monospace; font-size:14px; line-height:1; overflow:hidden; }
    .life-row { min-height:0; display:grid; grid-template-columns:minmax(44px, .65fr) minmax(68px, 1.2fr) minmax(44px, .65fr); align-items:center; gap:3px; }
    .life-btn { grid-row:1; position:relative; z-index:0; border:1px solid rgba(255,255,255,.08); background:linear-gradient(180deg,#23262b,#0c0e10); height:auto; margin:8px 0; border-radius:16px; box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.13); min-height:64px; padding:0; font-family:"IBM Plex Mono", monospace; font-size:clamp(35px, 10vw, 62px); font-weight:500; opacity:.86; touch-action:manipulation; }
    .life-btn:active { transform:translateY(2px) scale(.97); box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 2px 8px rgba(0,0,0,.4); }
    .life { font-family:"IBM Plex Mono", monospace; font-size:clamp(64px, 20vw, 122px); font-weight:600; line-height:.8; letter-spacing:-.09em; text-align:center; color:#fff; text-shadow:0 0 12px var(--neon), 0 0 32px var(--neon-dim), 0 2px 4px rgba(0,0,0,.5); font-variant-numeric:tabular-nums; border:0; background:transparent; padding:0; cursor:pointer; transition:transform .12s ease; }
    .life:active { transform:scale(.96); }
    .status { display:grid; grid-template-columns:40px 1fr 40px; align-items:center; gap:5px; }
    .jump { border:1px solid rgba(255,255,255,.09); background:linear-gradient(180deg,#23262b,#0e1013); box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); min-height:32px; border-radius:10px; font-family:"IBM Plex Mono", monospace; font-size:14px; font-weight:600; touch-action:manipulation; }
    .jump:active { transform:translateY(1px); box-shadow:0 2px 5px rgba(0,0,0,.45), inset 0 2px 6px rgba(0,0,0,.35); }
    .trackers { min-width:0; border:1px solid rgba(255,255,255,.05); background:rgba(0,0,0,.30); box-shadow:inset 0 1px 5px rgba(0,0,0,.55); border-radius:9px; min-height:32px; padding:2px 5px; display:flex; align-items:center; justify-content:center; gap:7px; font-family:"IBM Plex Mono", monospace; font-size:clamp(10px, 2.8vw, 13px); overflow:hidden; white-space:nowrap; }
    .trackers span { display:inline-flex; align-items:center; gap:3px; }
    .trackers svg { width:12px; height:12px; flex:none; fill:currentColor; opacity:.78; }
    .toolbar { position:fixed; z-index:10; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; gap:3px; padding:5px; border:1px solid rgba(255,255,255,.18); border-radius:16px; background:linear-gradient(160deg,#1a1d21,#0a0c0e); box-shadow:inset 0 1px 0 var(--chrome-hi), 0 6px 24px rgba(0,0,0,.7), 0 0 24px rgba(10,132,255,.15); }
    .phone-top { position:fixed; z-index:8; top:0; left:0; right:0; padding:calc(6px + env(safe-area-inset-top)) 14px 7px; text-align:center; background:linear-gradient(180deg, rgba(16,20,25,.97), rgba(10,13,16,.94)); border-bottom:1px solid rgba(255,255,255,.09); box-shadow:0 6px 18px rgba(0,0,0,.5); }
    .pt-title { font-size:17px; font-weight:800; letter-spacing:.02em; }
    .pt-turn { margin-top:1px; font:600 13px "IBM Plex Mono",monospace; color:#9aa3ad; font-variant-numeric:tabular-nums; }
    .phone-bottom { position:fixed; z-index:8; left:0; right:0; bottom:0; padding:8px 12px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, rgba(16,20,25,.97), rgba(10,13,16,.94)); border-top:1px solid rgba(255,255,255,.09); box-shadow:0 -6px 18px rgba(0,0,0,.5); }
    .phone-next { width:100%; min-height:54px; border:1px solid rgba(255,255,255,.10); border-radius:16px; background:linear-gradient(180deg,#2a2e35,#14171b); box-shadow:0 5px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.13); color:inherit; font-size:19px; font-weight:800; touch-action:manipulation; }
    .phone-next:active { transform:translateY(1px); }
    .tool { width:42px; height:34px; border:1px solid rgba(255,255,255,.10); border-radius:11px; background:linear-gradient(180deg,#26292e,#121518); color:#f6f8f7; display:grid; place-items:center; box-shadow:0 5px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.13); touch-action:manipulation; }
    .tool:active { transform:translateY(1px); box-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }
    /* ---- mana color picker ---- */
    .mana-pick-btn{border:1px solid var(--line);background:rgba(0,0,0,.2);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
    .mana-pick-btn svg{width:18px;height:18px}
    .mana-sheet{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(160deg,#1a1d21,#0a0c0e);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:16px;display:flex;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.8)}
    .mana-opt{width:52px;height:52px;border-radius:50%;border:2px solid transparent;background:rgba(255,255,255,.04);display:grid;place-items:center;cursor:pointer;padding:0}
    .mana-opt svg{width:36px;height:36px}
    .mana-opt:active{transform:scale(.92)}
    .mana-opt.sel{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
    .mana-bg{position:absolute;right:-10px;bottom:-20px;width:140px;height:140px;opacity:.07;pointer-events:none;z-index:0}
    .mana-bg svg{width:100%;height:100%}

    .tool[disabled] { opacity:.32; }
    .tool svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    @media (max-width:350px) {
      .toolbar { gap:2px; padding:3px; }
      .tool { width:36px; }
      .player-head { gap:3px; }
      .player-actions { gap:3px; }
      .player-hurry { padding:0 6px; font-size:10px; width:46px; }
    }
    #sound .mute-slash { display:none; }
    #sound[aria-pressed="true"] .sound-waves { display:none; }
    #sound[aria-pressed="true"] .mute-slash { display:block; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

    .shade { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.62); opacity:0; pointer-events:none; transition:opacity .16s ease; }
    .shade.open { opacity:1; pointer-events:auto; }
    .sheet { position:absolute; left:50%; bottom:0; transform:translate(-50%, 105%); width:min(100%, 520px); max-height:min(88dvh, 720px); overflow:auto; background:var(--sheet); color:light-dark(#18201c,#f4f7f5); border-radius:22px 22px 0 0; padding:10px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.35); transition:transform .2s ease; }
    .shade.open .sheet { transform:translate(-50%, 0); }
    .grab { width:44px; height:5px; margin:0 auto 15px; border-radius:5px; background:light-dark(#c0c8c3,#45504a); }
    .sheet-head { display:flex; gap:10px; align-items:center; }
    .player-name-input { min-width:0; flex:1; border:1px solid light-dark(#cbd2ce,#3b4741); border-radius:10px; background:light-dark(#fff,#202824); color:inherit; padding:9px 11px; font-size:21px; font-weight:700; }
    .close { border:0; background:light-dark(#e8ece9,#29332e); color:inherit; width:40px; height:40px; border-radius:50%; font-size:25px; line-height:1; }
    .section-title { margin:19px 0 8px; font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:light-dark(#4c5d54,#aab7b0); }
    .counter-row { display:grid; grid-template-columns:1fr 44px 56px 44px; gap:7px; align-items:center; min-height:52px; }
    .counter-row + .counter-row { border-top:1px solid light-dark(#d8ddda,#303a35); }
    .counter-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:18px; font-weight:600; }
    .counter-value { text-align:center; font-family:"IBM Plex Mono", monospace; font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
    .count-btn { border:1px solid rgba(255,255,255,.09); border-radius:50%; background:linear-gradient(180deg,#333a44,#22282f); box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); color:inherit; width:44px; height:44px; justify-self:center; font-family:"IBM Plex Mono",monospace; font-size:22px; touch-action:manipulation; }
    .count-btn:active { transform:scale(.92); }
    .danger-note { margin:12px 0 0; color:light-dark(#69776f,#93a39a); font-size:14px; line-height:1.35; }
    .d-dot { width:17px; height:17px; flex:none; border-radius:50%; }
    .d-life { display:flex; align-items:center; justify-content:center; gap:9px; margin:14px 0 2px; }
    .d-step { width:56px; height:54px; flex:none; border-radius:16px; border:1px solid rgba(255,255,255,.09); background:linear-gradient(180deg,#333a44,#22282f); box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); color:inherit; font-family:"IBM Plex Mono",monospace; font-size:18px; font-weight:700; touch-action:manipulation; }
    .d-step:active { transform:translateY(1px) scale(.97); }
    .d-life-num { font-family:"IBM Plex Mono",monospace; font-size:62px; font-weight:600; line-height:1; min-width:100px; text-align:center; font-variant-numeric:tabular-nums; }
    .d-log { display:grid; gap:6px; }
    .d-log-row { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:8px 13px; font-size:14px; font-weight:600; }
    .d-log-empty { border:1px solid rgba(255,255,255,.09); border-radius:12px; padding:14px; text-align:center; color:var(--muted); font-weight:600; font-size:15px; }
    .status-row { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:52px; }
    .status-row + .status-row { border-top:1px solid light-dark(#d8ddda,#303a35); }
    .d-toggle { min-width:66px; padding:9px 15px; border-radius:20px; border:1px solid rgba(255,255,255,.13); background:linear-gradient(180deg,#2b3038,#1a1e24); color:var(--muted); font-weight:800; font-size:13px; cursor:pointer; touch-action:manipulation; }
    .d-toggle.on { background:linear-gradient(180deg,#f0c05a,#d4a017); border-color:transparent; color:#241b03; box-shadow:0 0 14px rgba(224,173,72,.45); }
    .confirm { padding:12px 4px 4px; }
    .confirm h2 { margin:0 0 7px; font-size:25px; }
    .confirm p { margin:0 0 18px; color:light-dark(#58685f,#acb8b1); font-size:17px; line-height:1.35; }
    .confirm-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .confirm-actions button { border:1px solid rgba(255,255,255,.09); border-radius:12px; height:48px; background:linear-gradient(180deg,#333a44,#22282f); box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); color:inherit; font-size:18px; font-weight:700; }
    .confirm-actions .reset-yes { background:#b73830; color:#fff; }
    .dead { filter:saturate(.35) brightness(.62); }
    .dead .life { color:#ffddd9; }
    .seg { display:flex; gap:6px; flex-wrap:wrap; }
    .seg button { border:1px solid light-dark(#cbd2ce,#3b4741); background:light-dark(#fff,#202824); color:inherit; border-radius:10px; min-height:42px; padding:0 14px; font-weight:700; font-size:17px; }
    .seg button[aria-pressed="true"] { background:#23617a; border-color:#23617a; color:#fff; }
    .setup-names { display:grid; gap:7px; margin-top:10px; }
    .winner-list { display:grid; gap:8px; margin-top:6px; }
    .winner-btn { border:1px solid rgba(255,255,255,.09); border-radius:12px; min-height:54px; background:linear-gradient(180deg,#333a44,#22282f); box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); color:inherit; font-size:20px; font-weight:700; }
    .winner-btn:active { background:#23617a; color:#fff; }
    .stats-table { width:100%; border-collapse:collapse; margin-top:6px; font-size:16px; }
    .stats-table th, .stats-table td { padding:7px 6px; text-align:left; border-bottom:1px solid light-dark(#d8ddda,#303a35); font-variant-numeric:tabular-nums; }
    .stats-table th { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:light-dark(#4c5d54,#aab7b0); }
    .stats-table td.num, .stats-table th.num { text-align:right; }
    .champ { text-align:center; padding:14px 0 4px; }
    .champ .trophy { font-size:46px; }
    .champ h2 { margin:8px 0 2px; font-size:30px; }
    .champ p { margin:0 0 14px; color:light-dark(#58685f,#acb8b1); }
    .linklike { border:0; background:none; color:#c92f27; font-size:15px; padding:12px 0; }
    .sync-note { color:#8a8f98; font-size:12px; text-align:center; margin:6px 0 0; }
    .tablet-stats, .game-hud { display:none; }

    @media (min-width:768px) and (min-height:650px) {
      .board { inset:12px 12px 132px; gap:8px; background:transparent; }
      .player { border-radius:18px; box-shadow:0 3px 16px rgba(0,0,0,.22); }
      .player-inner { padding:14px 16px; grid-template-columns:minmax(68px,.55fr) minmax(0,1fr) minmax(68px,.55fr); }
      .tile-center { grid-template-rows:auto minmax(95px,.82fr) auto auto; }
      .name { font-size:23px; }
      .details { width:38px; height:34px; }
      .life { font-size:clamp(82px,13vw,128px); }
      .life { font-size:clamp(82px,13vw,128px); }
      .life-btn { font-size:58px; }
      .status { display:none; }
      .tablet-stats { display:grid; grid-template-columns:minmax(120px,.7fr) minmax(250px,1.8fr); gap:10px; align-items:stretch; }
      .stat-block { border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.14); border-radius:12px; padding:8px; min-width:0; }
      .stat-title { display:block; margin:0 0 5px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.72); }
      .stat-controls { display:grid; grid-template-columns:34px 1fr 34px; gap:4px; align-items:center; }
      .mini-btn { border:1px solid rgba(255,255,255,.09); height:34px; border-radius:9px; background:linear-gradient(180deg,#26292e,#121518); box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); color:#fff; font:600 19px/1 "IBM Plex Mono",monospace; }
      .mini-value { text-align:center; font:600 23px/1 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
      .cmd-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }

            var names=s.players.map(function(p){return p.name+' ('+p.life+')';}).join(', ');
            var when=''; try{ when=new Date(s.savedAt).toLocaleString(); }catch(e){}
            h+='<button class="resume-btn" data-resume="'+i+'"><strong>'+esc(names)+'</strong><span>'+esc(g.src)+' · '+esc(when)+' · Round '+s.round+'</span></button>';
          });
          h+='</div>';
          el.innerHTML=h;
          // store for click handler
          window._resumeGames=games;
        }catch(e){}
      }
      /* ---- manual saved games: named snapshots (Firebase lifecounter/saves + localStorage mirror) ---- */
      function loadSavesLocal(){ try{ var v=JSON.parse(localStorage.getItem('lc-saves')||'{}'); return (v&&typeof v==='object')?v:{}; }catch(e){ return {}; } }
      var lcSaves = loadSavesLocal();
      function storeSavesLocal(){ try{ localStorage.setItem('lc-saves', JSON.stringify(lcSaves)); }catch(e){} }
      function lcSetSaves(map){ lcSaves=(map&&typeof map==='object')?map:{}; storeSavesLocal(); renderSavesIfOpen(); }
      function saveSnapshot(){
        return JSON.parse(JSON.stringify({players:players, events:events, turn:turn, round:round, startLife:START_LIFE, mana:playerMana}));
      }
      function defaultSaveName(){
        var d=new Date();
        var when=d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
        return when+' · '+players.map(function(p){return p.name;}).join(', ');
      }
      function openSaveGame(){
        var summary=players.map(function(p){return p.name+' '+p.life;}).join(' · ');
        openSheet('<div class="sheet-head"><h2 id="sheetTitle" style="margin:0;flex:1;font-size:24px;">Save game</h2><button class="close" data-close aria-label="Close">×</button></div>'+
          '<h2 class="section-title">Name this save</h2>'+
          '<input id="savename" class="player-name-input" maxlength="60" value="'+esc(defaultSaveName())+'" aria-label="Save name">'+
          '<h2 class="section-title">Notes (optional)</h2>'+
          '<textarea id="savenote" class="save-note" maxlength="280" placeholder="Notes about this game — matchups, big plays, anything to remember" aria-label="Notes about this game"></textarea>'+
          '<p class="danger-note">'+esc(summary)+' · Round '+round+'</p>'+
          '<div class="confirm"><div class="confirm-actions" style="grid-template-columns:1fr;"><button class="reset-yes" data-save-confirm style="background:#23617a;">Save game</button></div></div>');
        setTimeout(function(){ var i=document.getElementById('savename'); if(i){ i.focus(); i.select(); } },120);
      }
      function doSaveGame(){
        var input=document.getElementById('savename');
        var name=(input&&input.value.trim())||defaultSaveName();
        var noteEl=document.getElementById('savenote');
        var note=(noteEl&&noteEl.value.trim())||'';
        var id='save-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        var snap=saveSnapshot();
        var rec={name:name, note:note, saved_at:new Date().toISOString(), players:snap.players, events:snap.events, turn:snap.turn, round:snap.round, startLife:snap.startLife, mana:snap.mana};
        lcSaves[id]=rec; storeSavesLocal();
        if(lcFbDb&&lcFbReady){ try{ lcFbDb.ref('lifecounter/saves/'+id).set(rec); }catch(e){} }
        addEvent('Game saved · '+name);
        closeSheet(); buzz(); render();
      }
      function recallSave(id){
        var rec=lcSaves[id];
        if(!rec||!rec.players||!rec.players.length) return;
        if(history.length>0 && !window.confirm('Load "'+(rec.name||'Saved game')+'"? Your current game will be replaced.')) return;
        try{
          players=JSON.parse(JSON.stringify(rec.players));
          players.forEach(function(p){ var t=timerOf(p); if(t.r){ t.r=false; t.s=0; } });
          turn=rec.turn||0; round=rec.round||1; START_LIFE=rec.startLife||40;
          if(rec.mana&&rec.mana.length){ playerMana=JSON.parse(JSON.stringify(rec.mana)); try{ localStorage.setItem('lc-mana', JSON.stringify(playerMana)); }catch(e){} }
          history=[]; undoBtn.disabled=true;
          events=(rec.events&&rec.events.length)?rec.events.slice():['Recalled save · '+(rec.name||'Saved game')];
          addEvent('Recalled save · '+(rec.name||'Saved game'));
          shade.classList.remove('open'); shade.setAttribute('aria-hidden','true');
          buzz(); render();
        }catch(e){}
      }
      function deleteSave(id){
        var rec=lcSaves[id];
        if(!rec) return;
        if(!window.confirm('Delete saved game "'+(rec.name||'Saved game')+'"?')) return;
        delete lcSaves[id]; storeSavesLocal();
        if(lcFbDb&&lcFbReady){ try{ lcFbDb.ref('lifecounter/saves/'+id).remove(); }catch(e){} }
        openStats();
      }
      function deleteAllSaves(){
        var n=Object.keys(lcSaves).length;
        if(!n) return;
        if(!window.confirm('Delete ALL '+n+' saved games? This cannot be undone.')) return;
        lcSaves={}; storeSavesLocal();
        if(lcFbDb&&lcFbReady){ try{ lcFbDb.ref('lifecounter/saves').remove(); }catch(e){} }
        openStats();
      }
      function savesListHtml(){
        var ids=Object.keys(lcSaves).sort(function(a,b){ var x=lcSaves[a].saved_at||'', y=lcSaves[b].saved_at||''; return x<y?1:(x>y?-1:0); });
        if(!ids.length) return '<p class="danger-note">No saved games yet. Tap the save button next to the trophy during a game to snapshot it here.</p>';
        var h='<div class="save-list">';
        ids.forEach(function(id){
          var r=lcSaves[id];
          if(!r||!r.players) return;
          var when=''; try{ when=new Date(r.saved_at).toLocaleString(); }catch(e){}
          var summary=r.players.map(function(p){return p.name+' '+p.life;}).join(' · ');
          h+='<div class="save-entry"><button class="save-recall" data-recall="'+id+'"><strong>'+esc(r.name||'Saved game')+'</strong><span>'+esc(summary)+'</span>'+(r.note?'<span class="save-note-text">📝 '+esc(r.note)+'</span>':'')+'<span>'+esc(when)+' · Round '+(r.round||1)+' · tap to load</span></button><button class="save-del" data-del-save="'+id+'" aria-label="Delete saved game ' + esc(r.name||'Saved game') + '" title="Delete this saved game">🗑</button></div>';
        });
        return h+'</div>';
      }
      function renderSavesIfOpen(){
        try{ if(shade.classList.contains('open') && sheet.querySelector('[data-saves-list]')) openStats(); }catch(e){}
      }
      function openSheet(html){
        active=null;
        sheet.innerHTML='<div class="grab"></div>'+html;
        shade.classList.add('open'); shade.setAttribute('aria-hidden','false');
      }
      function openSetup(){
        var saved=lastNames();
        setupState.n=players.length;
        setupState.names=players.map(function(p){return p.name;});
        if(saved && saved.length===setupState.n) setupState.names=saved.slice();
        setupState.starter=Math.min(turn, setupState.n-1);
        setupState.life=START_LIFE;
        renderSetup();
      }
      function renderSetup(){
        var s=setupState;
        var countBtns=[2,3,4,5,6].map(function(n){return '<button data-setup="n" data-v="'+n+'" aria-pressed="'+(s.n===n)+'">'+n+'</button>';}).join('');
        var nameInputs=s.names.map(function(nm,i){return '<input class="player-name-input" data-setup-name="'+i+'" maxlength="18" value="'+esc(nm)+'" placeholder="Player '+(i+1)+'" aria-label="Name for player '+(i+1)+'">';}).join('');
        var starterBtns=s.names.map(function(nm,i){return '<button data-setup="starter" data-v="'+i+'" aria-pressed="'+(s.starter===i)+'">'+esc((nm||'').trim()||('Player '+(i+1)))+'</button>';}).join('');
        var lifeBtns=[20,40].map(function(l){return '<button data-setup="life" data-v="'+l+'" aria-pressed="'+(s.life===l)+'">'+l+'</button>';}).join('');
        openSheet('<div class="sheet-head"><h2 id="sheetTitle" style="margin:0;flex:1;font-size:24px;">New game</h2><button class="close" data-close aria-label="Close">×</button></div>'+
          '<h2 class="section-title">Players</h2><div class="seg">'+countBtns+'</div>'+
          '<div class="setup-names">'+nameInputs+'</div>'+
          '<h2 class="section-title">Starting player</h2><div class="seg" id="setupStarter">'+starterBtns+'</div>'+
          '<h2 class="section-title">Starting life</h2><div class="seg">'+lifeBtns+'</div>'+
          '<div id="resume-list"></div><div class="confirm"><div class="confirm-actions" style="grid-template-columns:1fr;"><button class="reset-yes" data-setup-start style="background:#23617a;">Start game</button></div></div>');
      }
      function startGame(){
        var s=setupState, names=[];
        for(var i=0;i<s.n;i++){ names.push((s.names[i]||'').trim()||('Player '+(i+1))); }
        storeNames(names);
        START_LIFE=s.life;
        players=makePlayers(s.n,names,s.life);
        history=[]; undoBtn.disabled=true; turn=Math.min(s.starter,s.n-1); round=1;
        events=['New game · '+s.life+' life'];
        addEvent('Game started · '+names.join(', '));
        shade.classList.remove('open'); shade.setAttribute('aria-hidden','true');
        buzz(); render();
      }
      function openEndGame(){
        var btns=players.map(function(p,i){return '<button class="winner-btn" data-winner="'+i+'">'+esc(p.name)+'</button>';}).join('');
        openSheet('<div class="sheet-head"><h2 id="sheetTitle" style="margin:0;flex:1;font-size:24px;">End game</h2><button class="close" data-close aria-label="Close">×</button></div>'+
          '<h2 class="section-title">Who won?</h2><div class="winner-list">'+btns+'</div>');
      }
      function finishGame(i){
        var winner=players[i].name;
        var games=loadGames();
        var rec={d:new Date().toISOString(), players:players.map(function(p){return p.name;}), winner:winner, life:START_LIFE};
        games.push(rec);
        storeGames(games);
        queueSync({type:'game', game_id:gameId(rec), date:rec.d, players:rec.players.join(', '), winner:rec.winner, life:String(rec.life)});
        openSheet('<div class="champ"><div class="trophy">🏆</div><h2 id="sheetTitle">'+esc(winner)+' wins!</h2><p>'+esc(new Date().toLocaleDateString())+' · '+players.length+' players · recorded</p><div class="confirm-actions"><button data-close>Close</button><button class="reset-yes" data-setup-open style="background:#23617a;">New game</button></div></div>');
        buzz();
      }
      function openStats(){
        var games=loadGames(), names=[];
        games.forEach(function(g){ g.players.forEach(function(n){ if(names.indexOf(n)<0) names.push(n); }); });
        var rows=names.map(function(n){
          var played=games.filter(function(g){return g.players.indexOf(n)>=0;}).length;
          var wins=games.filter(function(g){return g.winner===n;}).length;
          return {n:n,played:played,wins:wins,rate:played?Math.round(wins/played*100):0};
        }).sort(function(a,b){return b.wins-a.wins||b.rate-a.rate;});
        var body=rows.length?rows.map(function(r){return '<tr><td>'+esc(r.n)+'</td><td class="num">'+r.played+'</td><td class="num">'+r.wins+'</td><td class="num">'+r.rate+'%</td></tr>';}).join(''):'<tr><td colspan="4">No games recorded yet.</td></tr>';
        var pairs=[];
        for(var a=0;a<names.length;a++) for(var b=a+1;b<names.length;b++){
          var A=names[a],B=names[b];
          var both=games.filter(function(g){return g.players.indexOf(A)>=0&&g.players.indexOf(B)>=0;});
          if(!both.length) continue;
          var aw=both.filter(function(g){return g.winner===A;}).length;
          pairs.push({a:A,b:B,aw:aw,bw:both.filter(function(g){return g.winner===B;}).length,n:both.length});
        }
        var h2h=pairs.length?pairs.map(function(p){return '<tr><td>'+esc(p.a)+' vs '+esc(p.b)+'</td><td class="num">'+p.aw+'–'+p.bw+'</td><td class="num">'+p.n+'</td></tr>';}).join(''):'<tr><td colspan="3">No matchups yet.</td></tr>';
        var recent=games.slice(-8).reverse().map(function(g){
          var d=new Date(g.d), ds=(d.getMonth()+1)+'/'+d.getDate();
          return '<tr><td>'+ds+'</td><td>'+esc(g.players.join(', '))+'</td><td><strong>'+esc(g.winner)+'</strong></td></tr>';
        }).join('');
        openSheet('<div class="sheet-head"><h2 id="sheetTitle" style="margin:0;flex:1;font-size:24px;">Records</h2><button class="close" data-close aria-label="Close">×</button></div>'+
          '<h2 class="section-title">Standings</h2><table class="stats-table"><thead><tr><th>Player</th><th class="num">Played</th><th class="num">Wins</th><th class="num">Win %</th></tr></thead><tbody>'+body+'</tbody></table>'+
          '<h2 class="section-title">Head-to-head</h2><table class="stats-table"><thead><tr><th>Matchup</th><th class="num">W–L</th><th class="num">Games</th></tr></thead><tbody>'+h2h+'</tbody></table>'+
          (recent?'<h2 class="section-title">Recent games</h2><table class="stats-table"><thead><tr><th>Date</th><th>Players</th><th>Winner</th></tr></thead><tbody>'+recent+'</tbody></table>':'')+
          '<h2 class="section-title">Saved games</h2><div data-saves-list>'+savesListHtml()+'</div>'+
          (Object.keys(lcSaves).length?'<button class="linklike" data-clear-saves>Delete all saved games</button>':'')+
          (games.length?'<button class="linklike" data-clear-history>Clear history</button>':'')+
          '<p class="sync-note">'+(function(){try{var s=localStorage.getItem('lc-synced-at');return s?'Synced across devices · '+s.slice(5,10).replace('-','/'):'Sync pending…';}catch(e){return '';}})()+'</p>');
      }
      sheet.addEventListener('click',function(e){
        var rb=e.target.closest('[data-resume]');
        if(rb){ var g=(window._resumeGames||[])[parseInt(rb.getAttribute('data-resume'),10)]; if(g) resumeGame(g.snap); return; }
        var rc=e.target.closest('[data-recall]');
        if(rc){ recallSave(rc.getAttribute('data-recall')); return; }
        var dl=e.target.closest('[data-del-save]');
        if(dl){ deleteSave(dl.getAttribute('data-del-save')); return; }
        if(e.target.closest('[data-clear-saves]')){ deleteAllSaves(); return; }
        if(e.target.closest('[data-save-confirm]')){ doSaveGame(); return; }
        var t=e.target.closest('[data-setup],[data-winner],[data-setup-start],[data-setup-open],[data-clear-history]');
        if(!t) return;
        if(t.hasAttribute('data-setup-start')){ startGame(); return; }
        if(t.hasAttribute('data-setup-open')){ openSetup(); setTimeout(populateResumeList,50); return; }
        if(t.hasAttribute('data-clear-history')){ if(window.confirm('Clear all recorded games? This clears history on all your devices.')){ var now=new Date().toISOString(); try{ localStorage.setItem('lc-cleared-at',now); }catch(e){} storeGames([]); queueSync({type:'clear_all',game_id:'',date:now,players:'',winner:'',life:''}); openStats(); } return; }
        if(t.hasAttribute('data-winner')){ finishGame(+t.getAttribute('data-winner')); return; }
        var kind=t.getAttribute('data-setup'), v=+t.getAttribute('data-v');
        if(kind==='n'){ setupState.n=v; while(setupState.names.length<v) setupState.names.push('Player '+(setupState.names.length+1)); setupState.names.length=v; setupState.starter=Math.min(setupState.starter,v-1); renderSetup(); return; }
        if(kind==='starter'){ setupState.starter=v; renderSetup(); return; }
        if(kind==='life'){ setupState.life=v; renderSetup(); return; }
      });
      sheet.addEventListener('input',function(e){
        var inp=e.target.closest('[data-setup-name]'); if(!inp) return;
        var i=+inp.getAttribute('data-setup-name'); setupState.names[i]=inp.value;
        var sb=sheet.querySelector('#setupStarter [data-v="'+i+'"]');
        if(sb) sb.textContent=inp.value.trim()||('Player '+(i+1));
      });

      /* Fresh-open default: a brand-new open starts as a 2-player game,
         Rachel vs Wesley. This only shapes the fresh start — resuming an
         active game or recalling a saved game replaces it wholesale. */
      try{
        players = makePlayers(2, ['Rachel','Wesley'], START_LIFE);
        turn = 0; round = 1; history = []; events = ['Game ready · 40 life'];
      }catch(e){}
      render();
      openSetup();
      try{
        setupState.n = 2; setupState.names = ['Rachel','Wesley']; setupState.starter = 0; setupState.life = START_LIFE;
        renderSetup(); setTimeout(populateResumeList,50);
      }catch(e){}
      pullSync(); flushSync();
      document.addEventListener('visibilitychange',function(){ if(!document.hidden) pullSync(); });
    })();
  </script>
</body>
</html>
