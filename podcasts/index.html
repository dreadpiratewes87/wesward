<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wes's Podcasts</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Podcasts">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a12;--surface:#14141c;--border:#26262f;--text:#f2f2f5;--muted:#9a9aa5;--accent:#8b5cf6;--accent2:#22d3ee}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:120px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,18,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px}
header h1{font-size:22px;font-weight:800;letter-spacing:.3px}
header h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{font-size:13px;color:var(--muted);margin-top:2px}
main{max-width:640px;margin:0 auto;padding:16px}
.show{margin-bottom:16px}
.show-tile{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:7px 10px;cursor:pointer;transition:transform .1s;width:100%;text-align:left;color:var(--text);font:inherit}
.show-tile:active{transform:scale(.98)}
.show-tile img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.show-tile .st-info{flex:1;min-width:0}
.show-tile h2{font-size:18px;font-weight:800}
.show-tile .hosts{font-size:12.5px;color:var(--muted);margin-top:2px}
.show-tile .count{font-size:11px;color:var(--accent2);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.6px}
.show-tile .chev{flex:0 0 auto;font-size:18px;color:var(--muted);transition:transform .25s;padding:0 4px}
.show.open .show-tile .chev{transform:rotate(180deg)}
.ep-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.show.open .ep-list{grid-template-rows:1fr}
.ep-list-inner{overflow:hidden;min-height:0;padding-top:9px}
.year-specials{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.year.open .year-specials{grid-template-rows:1fr}
.year-specials-inner{overflow:hidden;min-height:0;margin-left:20px;border-left:2px solid rgba(245,158,11,.35);padding-left:10px}
.year-specials-inner .ep{margin-bottom:10px}
.specials-toggle{display:flex;align-items:center;gap:6px;background:none;border:0;color:#f59e0b;font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.3px;cursor:pointer;padding:2px 8px 6px 66px;width:100%;text-align:left}
.specials-toggle .st-chev{display:inline-block;transition:transform .25s;font-size:11px}
.year.open .specials-toggle .st-chev{transform:rotate(180deg)}
.ep{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:7px 10px;margin-bottom:9px;cursor:pointer;transition:transform .1s;align-items:center}
.ep:active{transform:scale(.98)}
.ep-cover{position:relative;flex:0 0 auto}
.ep-cover img{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block}
.ep-num{position:absolute;left:-6px;bottom:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;border:2px solid var(--bg)}
.ep-num.special{background:linear-gradient(135deg,#f59e0b,#f97316);font-size:13px}
.ep-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ep-info h3{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:4px}
.ep-info p{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-meta{display:flex;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ep-play{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:rgba(139,92,246,.14);color:var(--accent2);display:grid;place-items:center;font-size:13px}
.ep-watch{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--muted);display:grid;place-items:center;font-size:13px;cursor:pointer;font:inherit}
.ep-watch.on{background:rgba(34,211,238,.16);color:var(--accent2);border-color:var(--accent2)}
.ep.is-watched{opacity:.5}
.ep.special-ep{padding:6px 8px;margin-bottom:8px;border-radius:12px}
.ep.special-ep .ep-cover img{width:38px;height:38px;border-radius:8px}
.ep.special-ep .ep-info h3{font-size:13.5px;margin-bottom:2px}
.ep.special-ep .ep-info p{font-size:11.5px;-webkit-line-clamp:1}
.ep.special-ep .ep-meta{margin-top:3px;font-size:11px}
.ep.special-ep .ep-play{width:30px;height:30px;font-size:12px}
.ep.special-ep .ep-num{min-width:20px;height:20px;font-size:11px;padding:0 4px}
.watched-bar{text-align:center;padding:6px 16px 0}
.watched-btn{background:none;border:1px dotted var(--muted);border-radius:999px;color:var(--muted);font:inherit;font-size:12.5px;padding:6px 14px;cursor:pointer}
.playing-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--accent2);text-transform:uppercase;margin-top:4px}
#player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(16,16,24,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateY(120%);transition:transform .25s}
#player.show{transform:translateY(0)}
#player .p-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
#player img{width:52px;height:52px;border-radius:10px;object-fit:cover}
#player .p-info{flex:1;min-width:0}
#player .p-info h3{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .p-info p{font-size:12px;color:var(--muted)}
#playBtn{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:20px;cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
#seekbar{width:100%;appearance:none;-webkit-appearance:none;height:5px;border-radius:3px;background:var(--border);outline:0}
#seekbar::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer}
.p-times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.ep-resume{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:#f5c518;letter-spacing:.02em}
.ep-prog{height:3px;background:rgba(255,255,255,.14);border-radius:2px;margin-top:6px;overflow:hidden}
.ep-prog i{display:block;height:100%;background:#f5c518;border-radius:2px}
</style>
</head>
<body>
<header>
<h1>Wes's <span>Podcasts</span></h1>
<p>Tap a show to browse its episodes</p>
</header>
<main id="list"></main>
<div class="watched-bar"><button class="watched-btn" id="watchedToggle">Show watched episodes (0)</button></div>

<div id="player">
<div class="p-top">
<img id="pCover" alt="">
<div class="p-info"><h3 id="pTitle"></h3><p id="pShow"></p></div>
<button id="playBtn" aria-label="Play or pause">▶</button>
</div>
<input type="range" id="seekbar" min="0" max="100" value="0" step="0.1">
<div class="p-times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
</div>
<div style="text-align:center;padding:26px 16px 8px"><a href="hosts.html" style="color:var(--muted);font-size:13px;text-decoration:none;border-bottom:1px dotted var(--muted);padding-bottom:1px">Meet the hosts · Show guidelines</a></div>
<audio id="audio" preload="metadata"></audio>

<script>
var audio=document.getElementById('audio');
var allEps=[];

function fmt(s){s=Math.floor(s||0);var m=Math.floor(s/60),ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
function fmtLong(s){s=Math.floor(s||0);var h=Math.floor(s/3600),m=Math.floor(s%3600/60);if(h)return h+'h '+m+'m';return m+' min';}

fetch('episodes.json?v=10',{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){
  var list=document.getElementById('list');
  var shows=data.shows||{};
  var eps=data.episodes||[];
  allEps=eps;
  if(!eps.length){list.innerHTML='<div class="empty">No episodes yet.</div>';return;}
  // Data-driven grouping: episodes carry a "show" key matching a show in
  // data.shows. Adding an episode = adding one entry to episodes.json;
  // a show tile appears automatically once it has at least one episode.
  var groups={};
  eps.forEach(function(e){(groups[e.show]=groups[e.show]||[]).push(e);});
  Object.keys(groups).forEach(function(k){groups[k].sort(function(a,b){return (b.num||0)-(a.num||0);});});
  function epHtml(e,s,extraClass){
    var chip = e.num
      ? '<div class="ep-num'+(e.kind==='special'?' special':'')+'">'+e.num+'</div>'
      : '<div class="ep-num special">★</div>';
    var label = e.num ? '#'+e.num+' '+e.title : (e.kind==='special' ? 'Special · '+e.title : e.title);
    return '<div class="ep'+(extraClass?' '+extraClass:'')+'" data-slug="'+e.slug+'">'
      +'<div class="ep-cover"><img src="covers/'+(e.cover||s.cover)+'" alt="" loading="lazy">'+chip+'</div>'
      +'<div class="ep-info"><h3>'+label+'</h3><p>'+(e.description||'')+'</p>'
      +'<div class="ep-meta"><span>'+fmtLong(e.duration)+'</span><span>'+(e.date||'')+'</span></div>'
      +'<span class="playing-badge" hidden>▶ Playing</span><span class="ep-resume" hidden></span><div class="ep-prog" hidden><i></i></div></div>'
      +'<div class="ep-play">▶</div><button class="ep-watch" data-watch="'+e.slug+'" aria-label="Mark as watched" title="Mark watched — hides this episode">✓</button></div>';
  }
  var html='';
  Object.keys(shows).forEach(function(key){
    var s=shows[key], ge=groups[key]||[];
    if(!ge.length)return;
    html+='<div class="show" data-show="'+key+'">'
      +'<button class="show-tile" aria-expanded="false">'
      +'<img src="covers/'+s.cover+'" alt="">'
      +'<div class="st-info"><h2>'+s.name+'</h2><div class="hosts">'+s.hosts+'</div>'
      +'<div class="count">'+ge.length+' episode'+(ge.length>1?'s':'')+'</div></div>'
      +'<div class="chev">▾</div></button>'
      +'<div class="ep-list"><div class="ep-list-inner">';
    if(key==='history'){
      // Tree: level 1 = main/year episodes only; each year expands to
      // level 2 = that year's specials (parent year = floor(num/100)).
      var mains=ge.filter(function(e){return e.kind!=='special';});
      var specsByYear={};
      ge.filter(function(e){return e.kind==='special';}).forEach(function(e){
        var y=Math.floor((e.num||0)/100);
        (specsByYear[y]=specsByYear[y]||[]).push(e);
      });
      var seen={};
      mains.forEach(function(e){
        var y=Math.floor((e.num||0)/100);
        var specs=specsByYear[y]||[];
        specs.forEach(function(sp){seen[sp.slug]=true;});
        html+='<div class="year open" data-year="'+y+'">'
          +epHtml(e,s,'year-main')
          +(specs.length
            ? '<button class="specials-toggle" aria-expanded="true"><span class="st-chev">▾</span><span>'+specs.length+' special'+(specs.length>1?'s':'')+'</span></button>'
            : '')
          +'<div class="year-specials"><div class="year-specials-inner">';
        specs.forEach(function(sp){html+=epHtml(sp,s,'special-ep');});
        html+='</div></div></div>';
      });
      // Orphan specials (no main episode for their year) stay reachable flat.
      ge.filter(function(e){return e.kind==='special'&&!seen[e.slug];}).forEach(function(e){html+=epHtml(e,s,'special-ep');});
    } else {
      ge.forEach(function(e){html+=epHtml(e,s);});
    }
    html+='</div></div></div>';
  });
  list.innerHTML=html;
  // Accordion: tapping a show tile expands its episode list below it and
  // collapses any other open show. Tapping the open show collapses it.
  list.querySelectorAll('.show-tile').forEach(function(tile){
    tile.addEventListener('click',function(){
      var wrap=tile.closest('.show');
      var wasOpen=wrap.classList.contains('open');
      list.querySelectorAll('.show.open').forEach(function(o){
        o.classList.remove('open');
        o.querySelector('.show-tile').setAttribute('aria-expanded','false');
      });
      if(!wasOpen){
        wrap.classList.add('open');
        tile.setAttribute('aria-expanded','true');
      }
    });
  });
  function toggleYear(yearEl){
    if(!yearEl)return;
    var open=yearEl.classList.toggle('open');
    var btn=yearEl.querySelector('.specials-toggle');
    if(btn)btn.setAttribute('aria-expanded',open?'true':'false');
  }
  list.querySelectorAll('.specials-toggle').forEach(function(btn){
    btn.addEventListener('click',function(ev){
      ev.stopPropagation();
      toggleYear(btn.closest('.year'));
    });
  });
  list.querySelectorAll('.ep').forEach(function(el){
    el.addEventListener('click',function(ev){
      if(ev.target.closest&&ev.target.closest('.ep-watch'))return;
      if(el.classList.contains('year-main')){
        // Play button plays the year episode; anywhere else on the row
        // expands/collapses that year's specials.
        if(ev.target.closest&&ev.target.closest('.ep-play')){playEp(el.dataset.slug);return;}
        toggleYear(el.closest('.year'));
        return;
      }
      playEp(el.dataset.slug);
    });
  });
  list.querySelectorAll('.ep-watch').forEach(function(btn){
    btn.addEventListener('click',function(ev){ev.stopPropagation();toggleWatched(btn.dataset.watch);});
  });
  paintResume();
  applyWatched();
});

var WATCH_KEY='podcast_watched_v1';
var showWatched=false;
function getWatched(){try{return JSON.parse(localStorage.getItem(WATCH_KEY)||'[]');}catch(_){return[];}}
function setWatched(arr){try{localStorage.setItem(WATCH_KEY,JSON.stringify(arr));}catch(_){}}
function toggleWatched(slug){
  var w=getWatched();var i=w.indexOf(slug);
  if(i>=0)w.splice(i,1);else w.push(slug);
  setWatched(w);applyWatched();
}
function applyWatched(){
  var w=getWatched();
  document.querySelectorAll('.ep').forEach(function(el){
    var on=w.indexOf(el.dataset.slug)>=0;
    el.classList.toggle('is-watched',on);
    var btn=el.querySelector('.ep-watch');if(btn)btn.classList.toggle('on',on);
    el.style.display=(!showWatched&&on)?'none':'';
  });
  document.querySelectorAll('.year').forEach(function(y){
    var eps=y.querySelectorAll('.ep');var all=eps.length>0;
    eps.forEach(function(el){if(w.indexOf(el.dataset.slug)<0)all=false;});
    y.style.display=(!showWatched&&all)?'none':'';
    var specs=y.querySelectorAll('.year-specials .ep');
    if(specs.length){
      var allS=true;specs.forEach(function(el){if(w.indexOf(el.dataset.slug)<0)allS=false;});
      var tg=y.querySelector('.specials-toggle'),sw=y.querySelector('.year-specials');
      var hideS=!showWatched&&allS;
      if(tg)tg.style.display=hideS?'none':'';
      if(sw)sw.style.display=hideS?'none':'';
    }
  });
  document.querySelectorAll('.show').forEach(function(sh){
    var total=sh.querySelectorAll('.ep').length,left=0;
    sh.querySelectorAll('.ep').forEach(function(el){if(w.indexOf(el.dataset.slug)<0)left++;});
    var c=sh.querySelector('.count');
    if(c)c.textContent=showWatched?(total+' episode'+(total>1?'s':'')):(left+' to listen'+(total-left>0?' · '+(total-left)+' watched':''));
  });
  var wt=document.getElementById('watchedToggle');
  if(wt)wt.textContent=showWatched?'Hide watched episodes':'Show watched episodes ('+w.length+')';
}
var POS_KEY='podcast_positions_v1';
function getPos(){try{return JSON.parse(localStorage.getItem(POS_KEY)||'{}');}catch(_){return{};}}
function savePos(slug,t,dur){
  var pos=getPos();
  if(t>10&&dur&&t<dur-15){pos[slug]=Math.floor(t);}
  else{delete pos[slug];}
  try{localStorage.setItem(POS_KEY,JSON.stringify(pos));}catch(_){}
}
function paintResume(){
  var pos=getPos();
  document.querySelectorAll('.ep').forEach(function(el){
    var slug=el.dataset.slug;
    var e=allEps.find(function(x){return x.slug===slug;});
    var note=el.querySelector('.ep-resume'),bar=el.querySelector('.ep-prog');
    if(!note||!bar)return;
    var t=pos[slug];
    if(t&&e&&e.duration){
      note.hidden=false;note.textContent='⏵ Resume '+fmt(t);
      bar.hidden=false;bar.querySelector('i').style.width=Math.min(100,t/e.duration*100)+'%';
    }else{note.hidden=true;bar.hidden=true;}
  });
}

function playEp(slug){
  var e=allEps.find(function(x){return x.slug===slug;});
  if(!e)return;
  if(audio.dataset.slug===slug&&audio.src){
    if(audio.paused){audio.play();document.getElementById('playBtn').textContent='⏸';}
    else{audio.pause();document.getElementById('playBtn').textContent='▶';}
    return;
  }
  audio.dataset.slug=slug;
  audio.src='audio/'+slug+'.mp3';
  audio.play();
  document.getElementById('pCover').src='covers/'+e.cover;
  document.getElementById('pTitle').textContent = e.kind==='special' ? '★ '+e.title : '#'+e.num+' '+e.title;
  document.getElementById('pShow').textContent=e.showName;
  document.getElementById('player').classList.add('show');
  document.getElementById('playBtn').textContent='⏸';
  document.querySelectorAll('.playing-badge').forEach(function(b){b.hidden=true;});
  var badge=document.querySelector('[data-slug="'+slug+'"] .playing-badge');
  if(badge)badge.hidden=false;
}

audio.addEventListener('loadedmetadata',function(){
  var slug=audio.dataset.slug;if(!slug)return;
  var t=getPos()[slug];
  if(t&&audio.duration&&t<audio.duration-15){try{audio.currentTime=t;}catch(_){}}
});
document.getElementById('playBtn').addEventListener('click',function(){
  if(audio.paused){audio.play();this.textContent='⏸';}
  else{audio.pause();this.textContent='▶';}
});
var lastSave=0;
audio.addEventListener('timeupdate',function(){
  if(audio.duration&&audio.dataset.slug&&Math.abs(audio.currentTime-lastSave)>=5){
    lastSave=audio.currentTime;savePos(audio.dataset.slug,audio.currentTime,audio.duration);
  }
  if(audio.duration){
    document.getElementById('seekbar').value=(audio.currentTime/audio.duration*100);
    document.getElementById('tCur').textContent=fmt(audio.currentTime);
    document.getElementById('tDur').textContent=fmt(audio.duration);
  }
});
audio.addEventListener('pause',function(){
  if(audio.dataset.slug)savePos(audio.dataset.slug,audio.currentTime,audio.duration);
  paintResume();
});
audio.addEventListener('ended',function(){
  document.getElementById('playBtn').textContent='▶';
  if(audio.dataset.slug){var w=getWatched();if(w.indexOf(audio.dataset.slug)<0){w.push(audio.dataset.slug);setWatched(w);}applyWatched();}
  if(audio.dataset.slug){var pos=getPos();delete pos[audio.dataset.slug];try{localStorage.setItem(POS_KEY,JSON.stringify(pos));}catch(_){}}
  paintResume();
});
document.getElementById('watchedToggle').addEventListener('click',function(){showWatched=!showWatched;applyWatched();});
document.getElementById('seekbar').addEventListener('input',function(){
  if(audio.duration)audio.currentTime=(this.value/100*audio.duration);
});
</script>
</body>
</html>
