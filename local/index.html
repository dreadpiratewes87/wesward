<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Port Orchard Local</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b1220;--surface:#131c2e;--surface2:#1a2639;--border:#26334d;--text:#f2f4f8;--muted:#93a1b8;--amber:#f5a623;--green:#34d399;--red:#f87171}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0}
header h1{font-size:22px;font-weight:800;letter-spacing:.3px}
header h1 span{color:var(--amber)}
header .clock{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.tab.active{background:var(--amber);border-color:var(--amber);color:#131313}
main{max-width:680px;margin:0 auto;padding:16px 16px 40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:transform .1s}
.tile:active{transform:scale(.98)}
.tile h3{font-size:16.5px;font-weight:700;line-height:1.25;margin-bottom:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.status .dot{width:8px;height:8px;border-radius:50%}
.status.open{background:rgba(52,211,153,.15);color:var(--green)}
.status.open .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.status.closed{background:rgba(248,113,113,.13);color:var(--red)}
.status.closed .dot{background:var(--red)}
.tile .sub{font-size:12.5px;color:var(--muted);line-height:1.45}
.tile-food{font-size:13px;line-height:1.5;color:#f5c66b;background:rgba(245,166,35,.09);border:1px solid rgba(245,166,35,.25);border-radius:9px;padding:7px 10px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
/* detail */
#detail{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .25s}
#detail.show{transform:translateY(0)}
.d-wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 48px}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;margin-bottom:16px}
#detail h2{font-size:26px;font-weight:800;line-height:1.2;margin-bottom:8px}
.d-status{margin-bottom:14px}
.d-actions{display:flex;gap:8px;margin:14px 0 20px;flex-wrap:wrap}
.d-actions a{flex:1;min-width:100px;text-align:center;text-decoration:none;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:600;padding:11px 8px;border-radius:12px}
.d-sec{margin-bottom:20px}
.d-sec h4{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.d-sec p,.d-sec li{font-size:14.5px;line-height:1.55;color:#dbe2ee}
.d-sec ul{list-style:none}
.d-sec li{padding:5px 0;border-bottom:1px solid var(--border)}
.d-sec li:last-child{border-bottom:0}
.hours-table{width:100%;border-collapse:collapse;font-size:14px}
.hours-table td{padding:6px 0;border-bottom:1px solid var(--border);color:#dbe2ee}
.hours-table tr.today td{color:var(--amber);font-weight:700}
.hours-table td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin-top:8px;font-style:italic}
/* events */
.ev-head{margin-bottom:6px}
.ev-head h2{font-size:20px;font-weight:800}
.ev-head p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.ev-day{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber);margin:20px 0 9px}
.ev-card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:9px;text-decoration:none;color:var(--text);transition:transform .1s}
.ev-card:active{transform:scale(.99)}
.lib-head{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:12px 15px;margin-bottom:9px;color:var(--text);font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;text-align:left}
.lib-count{background:rgba(245,158,11,.18);color:var(--amber);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800}
.lib-chev{margin-left:auto;color:var(--muted);transition:transform .25s}
.lib-head.open .lib-chev{transform:rotate(180deg)}
.lib-group .ev-card{margin-left:14px}
.ev-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ev-name{font-size:15.5px;font-weight:700;line-height:1.3}
.ev-cost{flex:0 0 auto;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(52,211,153,.15);color:var(--green);white-space:nowrap}
.ev-cost.paid{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.ev-meta{font-size:13px;color:#f5c66b;margin-top:4px}
.ev-sub{font-size:13px;color:var(--muted);line-height:1.45;margin-top:1px}
.ev-desc{font-size:13.5px;line-height:1.5;color:#dbe2ee;margin-top:5px}
.ev-src{font-size:11.5px;color:var(--muted);margin-top:6px}
.footer-note{text-align:center;color:var(--muted);font-size:12px;padding:8px 20px 30px;line-height:1.5}
</style>
<style>
/* Floating back button for the detail view (2026-10-12 — moved off the top, kept getting stuck behind the iPhone top edge) */
.backbtn.float{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:90;margin:0;padding:12px 19px;font-size:16px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.d-wrap{padding-bottom:110px}
</style>
</head>

var MTG_CHECKED = "October 30, 2026";
var DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
var DAYNAMES = {sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};
var activeCat = 'spots';

function toMin(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function fmtTime(t){
  var p=t.split(':'),h=+p[0],m=p[1],ap=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;
  return h+(m!=='00'?':'+m:'')+' '+ap;
}
// returns {open:bool, msg:"Closes 11 PM" / "Opens 4 PM"}
function statusOf(b, now){
  now = now || new Date();
  var day = DAYS[now.getDay()];
  var prev = DAYS[(now.getDay()+6)%7];
  var cur = now.getHours()*60 + now.getMinutes();
  // still in yesterday's late session?
  var ph = b.hours && b.hours[prev];
  if(ph && toMin(ph[1]) <= toMin(ph[0]) && cur < toMin(ph[1])){
    return {open:true, msg:'Closes '+fmtTime(ph[1])};
  }
  var h = b.hours && b.hours[day];
  if(!h) return {open:false, msg:'Hours unknown'};
  var o=toMin(h[0]), c=toMin(h[1]);
  if(c<=o) c+=1440; // closes after midnight
  if(cur>=o && cur<c){
    return {open:true, msg:'Closes '+fmtTime(h[1])};
  }
  if(cur<o) return {open:false, msg:'Opens '+fmtTime(h[0])+' today'};
  // closed for the day — find next opening
  for(var i=1;i<=7;i++){
    var nd = DAYS[(now.getDay()+i)%7];
    var nh = b.hours[nd];
    if(nh){
      var when = i===1?'tomorrow':DAYNAMES[nd];
      return {open:false, msg:'Opens '+fmtTime(nh[0])+' '+when};
    }
  }
  return {open:false, msg:'Hours unknown'};
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function evCardHtml(e){
  var freeLike=(e.cost==='Free'||e.cost==='Free entry');
  var chip=e.cost?'<span class="ev-cost'+(freeLike?'':' paid')+'">'+esc(e.cost)+'</span>':'';
  return '<a class="ev-card" href="'+esc(e.url)+'" target="_blank" rel="noopener">'
    +'<div class="ev-top"><span class="ev-name">'+esc(e.name)+'</span>'+chip+'</div>'
    +'<div class="ev-meta">🕐 '+esc(e.time)+'</div>'
    +'<div class="ev-sub">📍 '+esc(e.venue)+' · '+esc(e.city)+'</div>'
    +(e.desc?'<div class="ev-desc">'+esc(e.desc)+'</div>':'')
    +'<div class="ev-src">Event details ↗</div></a>';
}
function isLibraryEvent(e){
  return /librar/i.test(e.venue||'') || (e.url||'').indexOf('bibliocommons')>=0;
}
function renderEvents(){
  var grid=document.getElementById('grid');
  grid.style.gridTemplateColumns='1fr';
  var today=new Date(); today.setHours(0,0,0,0);
  var items=EVENTS.slice().sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?-1:1;
    return (a.startMin||0)-(b.startMin||0);
  });
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var html='<div class="ev-head"><h2>📅 Upcoming Events</h2><p>Kitsap County · the next 7 days · Events checked '+esc(EVENTS_CHECKED)+'</p></div>';
  var lastDate='';
  var libBuf=[];
  function flushLib(){
    if(!libBuf.length)return;
    html+='<button class="lib-head"><span>📚 Library events</span><span class="lib-count">'+libBuf.length+'</span><span class="lib-chev">▾</span></button>'
      +'<div class="lib-group" hidden>'+libBuf.map(evCardHtml).join('')+'</div>';
    libBuf=[];
  }
  items.forEach(function(e){
    if(e.date!==lastDate){
      flushLib();
      lastDate=e.date;
      var d=new Date(e.date+'T12:00:00');
      var rel=Math.round((d-today)/86400000);
      var label=(rel===0?'Today · ':rel===1?'Tomorrow · ':'')+DAYNAMES[DAYS[d.getDay()]]+', '+months[d.getMonth()]+' '+d.getDate();
      html+='<div class="ev-day">'+label+'</div>';
    }
    if(isLibraryEvent(e)){ libBuf.push(e); return; }
    html+=evCardHtml(e);
  });
  flushLib();
  grid.innerHTML=html;
  grid.querySelectorAll('.lib-head').forEach(function(b){
    b.addEventListener('click',function(){
      var g=b.nextElementSibling;
      var open=g.hidden;
      g.hidden=!open;
      b.classList.toggle('open',open);
    });
  });
}

function renderGrid(){
  if(activeCat==='mtg'){renderMtg();return;}
  if(activeCat==='events'){renderEvents();return;}
  document.getElementById('grid').style.gridTemplateColumns='';
  var now=new Date();
  var items = DATA.filter(function(b){return b.category===activeCat;});
  // open ones first, then alphabetical
  items.sort(function(a,b){
    var sa=statusOf(a,now).open?0:1, sb=statusOf(b,now).open?0:1;
    if(sa!==sb)return sa-sb;
    return a.name.localeCompare(b.name);
  });

    var s=statusOf(b,now);
    var foodLine='';

    }
    html+='<div class="tile" data-id="'+b.id+'">'
      +'<h3>'+b.name+'</h3>'
      +'<span class="status '+(s.open?'open':'closed')+'"><span class="dot"></span>'+(s.open?'Open':'Closed')+' · '+s.msg+'</span>'
      +foodLine
      +'</div>';
  });
  document.getElementById('grid').innerHTML=html||'<p style="color:var(--muted)">Nothing here yet.</p>';
  document.querySelectorAll('.tile').forEach(function(t){
    t.addEventListener('click',function(){openDetail(t.dataset.id);});
  });
}

function openDetail(id){
  var b=DATA.find(function(x){return x.id===id;});
  if(!b)return;
  var now=new Date(), s=statusOf(b,now);
  var todayKey=DAYS[now.getDay()];
  var order=['mon','tue','wed','thu','fri','sat','sun'];
  var hoursRows='';
  order.forEach(function(d){
    var h=b.hours&&b.hours[d];
    var txt=h?fmtTime(h[0])+' – '+fmtTime(h[1]):'Closed';
    hoursRows+='<tr class="'+(d===todayKey?'today':'')+'"><td>'+DAYNAMES[d]+'</td><td>'+txt+'</td></tr>';
  });
  var evHtml='';
  if(b.events&&b.events.length){
    evHtml='<div class="d-sec"><h4>Events</h4><ul>'+b.events.map(function(e){return '<li><strong>'+e.day+'</strong> — '+e.what+'</li>';}).join('')+'</ul></div>';
  }
  var foodHtml='';
  if(b.food&&b.food.length){
    foodHtml='<div class="d-sec"><h4>'+(b.category==='bars'?'Known for eating':'What they carry')+'</h4><ul>'+b.food.map(function(f){return '<li>'+f+'</li>';}).join('')+'</ul></div>';
  }
  var mapsUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b.name+' '+b.address);
  document.getElementById('dWrap').innerHTML=
    '<button class="backbtn" id="dBack">← All places</button>'
    +'<h2>'+b.name+'</h2>'
    +'<span class="status d-status '+(s.open?'open':'closed')+'"><span class="dot"></span>'+(s.open?'Open now':'Closed')+' · '+s.msg+'</span>'
    +'<div class="d-actions">'
    +(b.phone?'<a href="tel:'+b.phone.replace(/[^0-9+]/g,'')+'">📞 Call</a>':'')
    +'<a href="'+mapsUrl+'" target="_blank" rel="noopener">📍 Directions</a>'
    +(b.website?'<a href="'+b.website+'" target="_blank" rel="noopener">🌐 Website</a>':'')
    +'</div>'
    +'<div class="d-sec"><h4>Address</h4><p>'+b.address+'</p></div>'
    +(b.knownFor?'<div class="d-sec"><h4>What it\'s known for</h4><p>'+b.knownFor+'</p></div>':'')
    +evHtml+foodHtml
    +'<div class="d-sec"><h4>Hours</h4><table class="hours-table">'+hoursRows+'</table>'
    +(b.hoursNote?'<p class="note">'+b.hoursNote+'</p>':'')+'</div>';
  document.getElementById('detail').classList.add('show');
  document.getElementById('detail').scrollTop=0;
  document.getElementById('dBack').addEventListener('click',closeDetail);
}
function closeDetail(){document.getElementById('detail').classList.remove('show');}

function tick(){
  var now=new Date();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var h=now.getHours(),ap=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;
  var m=now.getMinutes();if(m<10)m='0'+m;
  document.getElementById('clock').textContent=days[now.getDay()]+' · '+h+':'+m+' '+ap+' — live open/closed status';
}
renderTabs();renderGrid();tick();
setInterval(function(){tick();renderGrid();},60000);
</script>

<script>(function(){var detail=document.getElementById('detail'),wrap=document.getElementById('dWrap');function move(){var b=document.getElementById('dBack');if(!b)return;if(detail.classList.contains('show')){if(b.parentNode!==document.body){b.classList.add('float');document.body.appendChild(b)}}else if(b.parentNode===document.body){b.remove()}}new MutationObserver(move).observe(detail,{attributes:true,attributeFilter:['class']});new MutationObserver(move).observe(wrap,{childList:true});move()})();</script>

</body>
</html>
