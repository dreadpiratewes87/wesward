    /* Polished compact restyle */
    :root{--bg:#101719;--paper:#182124;--paper-2:#222d30;--ink:#f0f5f5;--muted:#a8b7ba;--line:#344347;--accent:#f0642f;--accent-ink:#fff;--teal:#38b6a7;--teal-soft:#173c38;--gold:#d7a541;--red:#ef665b;--green:#4cbd83;--shadow:0 10px 28px rgba(0,0,0,.22);--radius-sm:4px;--radius-md:7px;--radius-lg:11px}

    body{font-size:16px;background:var(--bg)}
    .app{padding-top:clamp(12px,2vw,24px)}
    button{min-height:44px}
    .home-lead{align-items:center;margin:clamp(14px,3vw,32px) 0 20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .home-lead h1{font-size:clamp(38px,6.5vw,68px);line-height:.92;letter-spacing:-.018em}
    .home-lead p{font-size:13px;letter-spacing:.03em;text-transform:uppercase}
    .nav-grid{gap:10px}
    .nav-card{min-height:142px;padding:16px 18px;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius-sm)!important}
    .nav-card:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--teal) 58%,var(--line))}
    .nav-card.projects{background:#101b1e;color:var(--ink)}
    
    .nav-card.todo,.nav-card.recipes{background:var(--paper)}
    .nav-card.sketch{background:#173b3a;color:#ecf9f7}
    
    .nav-card.harvest{min-height:124px;background:#116f68;color:#fff}
    
    .nav-card.letters{min-height:110px;background:#6e5228;color:#fbf3e2}
    .nav-card .icon{width:30px;height:30px;stroke-width:2.5}
    .nav-card strong{font-size:clamp(25px,3.3vw,35px);letter-spacing:.005em;margin-bottom:4px}

    .nav-card .arrow{top:12px;right:16px;font-size:20px}

<script>
/* shared snapshot: #list=<base64url JSON> */
var WL_SHARED_DATA=null;
try{
  if(location.hash.indexOf('#list=')===0){
    var s=location.hash.slice(6).replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4) s+='=';
    WL_SHARED_DATA=JSON.parse(decodeURIComponent(escape(atob(s))));
  }
}catch(e){ WL_SHARED_DATA=null; }
</script>
<script>
/* ==== WATCHLIST ==== */
(function(){
  var KEY='wl-items-v1';
  var SHARED=(typeof WL_SHARED_DATA!=='undefined'&&WL_SHARED_DATA)?WL_SHARED_DATA:null;
  function load(){ if(SHARED) return SHARED; try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
  function save(a){ if(SHARED) return; try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} }

  /* ---- cross-device sync (via link) ---- */
  var DEVICE_ID=(function(){
    try{
      var d=localStorage.getItem('wl-device-id');
      if(!d){ d='d'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36); localStorage.setItem('wl-device-id',d); }
      return d;
    }catch(e){ return 'd-unknown'; }
  })();
  function touch(it){ it.updated_at=Date.now(); it.device_id=DEVICE_ID; fbWrite(it); }
  /* ---- Firebase real-time sync ---- */
  var FB_CONFIG={apiKey:"AIzaSyCOZbXH7bwuQsNFXeSNNi1eS90KrJxlvOw",authDomain:"wesward-watchlist.firebaseapp.com",databaseURL:"https://wesward-watchlist-default-rtdb.firebaseio.com",projectId:"wesward-watchlist"};
  var fbDb=null, fbReady=false;
  function fbClean(x){ try{ return JSON.parse(JSON.stringify(x)); }catch(e){ return null; } }
  function fbWrite(it){
    if(!fbDb||!fbReady||SHARED) return;
    try{ var c=fbClean(it); if(c) fbDb.ref('watchlist/items/'+it.id).set(c); }catch(e){}
  }
  function fbDelete(it){
    if(!fbDb||!fbReady||SHARED) return;
    try{ fbDb.ref('watchlist/items/'+it.id).set({id:it.id,deleted:true,updated_at:Date.now()}); }catch(e){}
  }
  function fbMerge(cloud){
    if(!cloud) return;
    var changed=false, byId={};
    items.forEach(function(x){ byId[x.id]=x; });
    Object.keys(cloud).forEach(function(id){
      var c=cloud[id]; if(!c) return;
      var l=byId[id];
      if(c.deleted){
        if(l){ items=items.filter(function(x){return x.id!==id;}); changed=true; }
      }else if(!l||(c.updated_at||0)>(l.updated_at||0)){
        if(l){ for(var k in c){ l[k]=c[k]; } }
        else{ items.push(c); }
        changed=true;
      }
    });
    if(changed){ save(items); render(); }
  }
  function initFirebase(){
    if(SHARED) return;
    try{
      if(typeof firebase==='undefined') return;
      firebase.initializeApp(FB_CONFIG);
      fbDb=firebase.database();
      try{
        fbDb.ref('watchlist/config').on('value',function(snap){
          var v=snap.val()||{};
          if(v.tmdbKey&&v.tmdbKey!==WL_TMDB_KEY){
            WL_TMDB_KEY=v.tmdbKey;
            try{ localStorage.setItem('wl-tmdb-key',v.tmdbKey); }catch(e){}
            tmdbBtnLabel();
          }
        });
      }catch(e){}
      var ref=fbDb.ref('watchlist/items');
      ref.once('value').then(function(snap){
        var cloud=snap.val()||{};
        items.forEach(function(x){
          var c=cloud[x.id];
          if(!c||(x.updated_at||0)>(c.updated_at||0)){ try{ fbDb.ref('watchlist/items/'+x.id).set(fbClean(x)); }catch(e){} }
        });
        fbReady=true;
      }).catch(function(){ fbReady=true; });
      ref.on('value',function(snap){ fbMerge(snap.val()||{}); });
    }catch(e){}
  }
  function buildSyncLink(){
    var data=items.map(function(x){
      return {title:x.title,type:x.type,year:x.year||'',service:x.service||'',notes:x.notes||'',
        progress:x.progress||'',watched:!!x.watched,info:x.info||'',poster:x.poster||'',
        releaseDate:x.releaseDate||'',releaseKind:x.releaseKind||'',
        streamingService:x.streamingService||'',streamingDate:x.streamingDate||'',
        tmdbId:x.tmdbId||'',tmdbType:x.tmdbType||'',
        updated_at:x.updated_at||0};
    });
    var s=btoa(unescape(encodeURIComponent(JSON.stringify(data))))
      .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    return 'https://dreadpiratewes87.github.io/wesward/watchlist/#list='+s;
  }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var items=load(), view='movie';
  var WL_SEEDS=[
    {id:'wl-seed-1',title:'East of Eden',type:'Show',service:'Netflix',notes:'2026 limited series',watched:false,poster:'https://static.tvmaze.com/uploads/images/medium_portrait/643/1609556.jpg'},
    {id:'wl-seed-2',title:'The Magicians',type:'Show',service:'Netflix',notes:'',watched:false,poster:'https://static.tvmaze.com/uploads/images/medium_portrait/229/573329.jpg'},
    {id:'wl-seed-3',title:'Street Fighter',type:'Movie',service:'',notes:'2026 film',watched:false,poster:'https://upload.wikimedia.org/wikipedia/en/d/d4/Street_Fighter_2026_film_poster.jpeg',info:'https://en.wikipedia.org/wiki/Street_Fighter_(2026_film)'},
    {id:'wl-seed-4',title:'Dutton Ranch',type:'Show',service:'Paramount+',notes:'Yellowstone Beth & Rip spinoff',watched:false,poster:'https://static.tvmaze.com/uploads/images/medium_portrait/625/1563140.jpg'},
    {id:'wl-seed-5',title:'Digger',type:'Movie',service:'',notes:'2026 film · Tom Cruise',watched:false,poster:'https://upload.wikimedia.org/wikipedia/en/7/7b/Digger_%282026_film%29_poster.jpg',info:'https://en.wikipedia.org/wiki/Digger_(2026_film)',releaseDate:'2026-10-02',releaseKind:'theatrical'},
    {id:'wl-seed-6',title:'The Deuce',type:'Show',service:'HBO',notes:'70s Times Square',watched:false,poster:'https://static.tvmaze.com/uploads/images/medium_portrait/210/526668.jpg'}
  ];
  try{
    if(!SHARED&&localStorage.getItem('wl-seed-ver')!=='3'){
      var byId={}; items.forEach(function(x){byId[x.id]=x;});
      WL_SEEDS.slice().reverse().forEach(function(s){
        var ex=byId[s.id];
        if(ex){
          ex.poster=s.poster||ex.poster;
          ex.info=s.info||ex.info;
          ex.releaseDate=s.releaseDate||ex.releaseDate;
          ex.releaseKind=s.releaseKind||ex.releaseKind;
          ex.year=s.year||ex.year;
        }else{
          s.added=new Date().toISOString(); items.unshift(JSON.parse(JSON.stringify(s)));
        }
      });
      save(items); localStorage.setItem('wl-seed-ver','3');
    }
  }catch(e){}

  /* ---- autocomplete: match real releases ---- */
  var picked=null, searchTimer=null, pickToken=0;
  var titleInput=document.getElementById('wl-title');
  var suggestBox=document.getElementById('wl-suggest');
  var WL_TMDB_KEY=''; try{ WL_TMDB_KEY=localStorage.getItem('wl-tmdb-key')||''; }catch(e){}
  function tmdbSearch(q){
    if(!WL_TMDB_KEY) return Promise.resolve([]);
    return fetch('https://api.themoviedb.org/3/search/multi?api_key='+encodeURIComponent(WL_TMDB_KEY)+'&include_adult=false&query='+encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(d){
        return (d.results||[]).filter(function(x){ return x.media_type==='movie'||x.media_type==='tv'; }).slice(0,8).map(function(x){
          var isM=x.media_type==='movie';
          var date=isM?(x.release_date||''):(x.first_air_date||'');
          return {title:(isM?x.title:x.name)||'', year:(date||'').slice(0,4),
            premiered:isM?'':date, releaseDate:isM?date:'', releaseKind:'theatrical',
            status:'', network:'', type:isM?'Movie':'Show',
            info:'https://www.themoviedb.org/'+(isM?'movie':'tv')+'/'+x.id,
            poster:x.poster_path?('https://image.tmdb.org/t/p/w342'+x.poster_path):'',
            tmdbId:x.id, tmdbType:x.media_type, src:'TMDB'};
        });
      }).catch(function(){ return []; });
  }
  function tmdbGet(path){
    return fetch('https://api.themoviedb.org/3'+path+(path.indexOf('?')>=0?'&':'?')+'api_key='+encodeURIComponent(WL_TMDB_KEY))
      .then(function(r){ return r.json(); });
  }
  function tvSearch(q){
    return fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(arr){
        return (arr||[]).slice(0,5).map(function(x){
          var s=x.show||{};
          return {title:s.name||'', year:(s.premiered||'').slice(0,4),
                  premiered:s.premiered||'', status:s.status||'',
                  network:((s.network||{}).name||'')||((s.webChannel||{}).name||''),
                  type:'Show',
                  info:s.officialSite||s.url||'',
                  poster:((s.image||{}).medium||''), src:'TV'};
        });
      }).catch(function(){ return []; });
  }
  function wikiSearch(q){
    var u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*'
      +'&prop=pageimages|info&inprop=url&pithumbsize=200'
      +'&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=8&gsrnamespace=0';
    return fetch(u).then(function(r){ return r.json(); }).then(function(d){
      var pages=(d.query&&d.query.pages)||{};
      var out=Object.keys(pages).map(function(k){
        var p=pages[k];
        var ttl=p.title||'';
        var ym=ttl.match(/\((\d{4}) film\)/);
        var isFilm=/\(\d{4} film\)/.test(ttl)||/\(film\)/.test(ttl);
        var isShow=/\(TV series\)/.test(ttl)||/\(miniseries\)/.test(ttl);
        var clean=ttl.replace(/\s*\((?:\d{4} )?(?:film|TV series|miniseries)\)\s*$/,'');
        return {title:clean, wiki:ttl, year:ym?ym[1]:'', premiered:'', status:'', network:'',
                type:isFilm?'Movie':(isShow?'Show':''), info:p.fullurl||'',
                poster:((p.thumbnail||{}).source||''), src:'Wiki',
                _ord:(isFilm||isShow)?0:1, _idx:(p.index||99)};
      });
      out.sort(function(a,b){ return (a._ord-b._ord)||(a._idx-b._idx); });
      return out;
    }).catch(function(){ return []; });
  }
  var WL_SERVICES='Netflix|Hulu|Peacock|Paramount\\+|Disney\\+|Max|HBO Max|Apple TV\\+|Amazon Prime Video|Prime Video|Starz|AMC\\+|Crunchyroll|Tubi';
  function parseWikiInfo(txt){
    var out={};
    if(!txt) return out;
    var m=txt.match(/released theatrically[^.]{0,80}?on ([A-Z][a-z]+ \d{1,2}, \d{4})/)
      ||txt.match(/released in the United States[^.]{0,80}?on ([A-Z][a-z]+ \d{1,2}, \d{4})/)
      ||txt.match(/scheduled to be released[^.]{0,80}?on ([A-Z][a-z]+ \d{1,2}, \d{4})/)
      ||txt.match(/set to be released[^.]{0,80}?on ([A-Z][a-z]+ \d{1,2}, \d{4})/)
      ||txt.match(/theatrically released[^.]{0,80}?on ([A-Z][a-z]+ \d{1,2}, \d{4})/);
    if(m){
      var dt=new Date(m[1]);
      if(!isNaN(dt)){ out.releaseDate=dt.toISOString().slice(0,10); out.releaseKind='theatrical'; }
    }
    var sm=txt.match(new RegExp('(?: released| premiered| debuted) on ('+WL_SERVICES+') on ([A-Z][a-z]+ \\d{1,2}, \\d{4})'))
      ||txt.match(new RegExp('(?: streaming| available)[^.]{0,60}?on ('+WL_SERVICES+')(?: from| starting| on) ([A-Z][a-z]+ \\d{1,2}, \\d{4})'))
      ||txt.match(new RegExp('will be released on ('+WL_SERVICES+') on ([A-Z][a-z]+ \\d{1,2}, \\d{4})'));
    if(sm){
      out.streamingService=sm[1];
      var sd=new Date(sm[2]);
      if(!isNaN(sd)) out.streamingDate=sd.toISOString().slice(0,10);
    }else{
      var sv=txt.match(new RegExp('(?: released| premiered| streaming| available)[^.]{0,80}?\\bon ('+WL_SERVICES+')\\b'));
      if(sv) out.streamingService=sv[1];
      var dg=txt.match(/released (?:on|through) digital platforms?[^.]{0,40}?on ([A-Z][a-z]+ \d{1,2}, \d{4})/);
      if(dg){
        var dd=new Date(dg[1]);
        if(!isNaN(dd)){ out.streamingService=out.streamingService||'Digital / VOD'; out.streamingDate=dd.toISOString().slice(0,10); }
      }
    }
    return out;
  }
  function enrichWiki(r){
    var pageTitle=r.wiki||r.title;
    var t=encodeURIComponent(pageTitle.replace(/ /g,'_'));
    var p1=fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+t)
      .then(function(x){ return x.json(); })
      .then(function(d){
        if(d.thumbnail&&d.thumbnail.source) r.poster=d.thumbnail.source;
      }).catch(function(){});
    var u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*'
      +'&prop=extracts&explaintext&titles='+encodeURIComponent(pageTitle);
    var p2=fetch(u).then(function(x){ return x.json(); }).then(function(d){
      var pages=(d.query&&d.query.pages)||{};
      var k=Object.keys(pages)[0];
      var txt=k&&pages[k].extract?pages[k].extract:'';
      var info=parseWikiInfo(txt);
      if(info.releaseDate){ r.releaseDate=info.releaseDate; r.releaseKind=info.releaseKind; }
      if(info.streamingService) r.streamingService=info.streamingService;
      if(info.streamingDate) r.streamingDate=info.streamingDate;
    }).catch(function(){});
    return Promise.all([p1,p2]);
  }
  function rankResults(list,q){
    var ql=q.toLowerCase();
    function score(r){
      var t=(r.title||'').toLowerCase(), s=0;
      if(t===ql) s+=100; else if(t.indexOf(ql)===0) s+=50; else if(t.indexOf(ql)>=0) s+=20;
      if(r.src==='TV') s+=10;
      if(r.src==='TMDB') s+=15;
      if(r.type) s+=4;
      if(r.poster) s+=3;
      if(r.year) s+=2;
      return s;
    }
    return list.slice().sort(function(a,b){ return score(b)-score(a); });
  }
  function renderSuggest(list){
    if(!list.length){ suggestBox.hidden=true; return; }
    suggestBox.innerHTML=list.map(function(r,i){
      return '<button type="button" class="wl-sug" data-i="'+i+'">'
        +(r.poster?'<img src="'+esc(r.poster)+'" alt="" loading="lazy" />':'<span class="wl-sug-nopic"></span>')
        +'<span class="wl-sug-t"><strong>'+esc(r.title)+'</strong>'
        +'<small>'+esc([r.type,r.year,r.network,r.status].filter(Boolean).join(' · '))+'</small></span></button>';
    }).join('');
    suggestBox.hidden=false;
    suggestBox.querySelectorAll('.wl-sug').forEach(function(b){
      b.addEventListener('click',function(){
        var r=list[+b.getAttribute('data-i')];
        suggestBox.hidden=true;
        if(r.src==='Wiki'){
          Promise.race([enrichWiki(r),new Promise(function(res){ setTimeout(res,1500); })])
            .then(function(){ commitAdd(r); });
        }else{
          commitAdd(r);
        }
      });
    });
  }
  if(titleInput){
    titleInput.addEventListener('input',function(){
      picked=null;
      var q=titleInput.value.trim();
      clearTimeout(searchTimer);
      if(q.length<2){ suggestBox.hidden=true; return; }
      searchTimer=setTimeout(function(){
        Promise.all([tmdbSearch(q),tvSearch(q),wikiSearch(q)]).then(function(rs){
          var seen={}, out=[];
          rs[0].concat(rs[1],rs[2]).forEach(function(r){
            var k=(r.title||'').toLowerCase()+'|'+(r.year||'');
            if(r.title && !seen[k]){ seen[k]=1; out.push(r); }
          });
          if(titleInput.value.trim()===q) renderSuggest(rankResults(out,q).slice(0,10));
        });
      },350);
    });
    titleInput.addEventListener('blur',function(){ setTimeout(function(){ suggestBox.hidden=true; },200); });
  }

  /* ---- release line (upcoming only) ---- */
  function releaseLine(x){
    var s='';
    if(x.releaseDate){
      var d=new Date(x.releaseDate+'T12:00:00');
      if(!isNaN(d)){
        var today=new Date(); today.setHours(0,0,0,0);
        if(d>=today){
          s=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
          s=(x.releaseKind==='premiere'?'Premieres ':'In theaters ')+s;
          if(x.service) s+=' · '+x.service;
          return s;
        }
      }
    }
    if(x.service) return x.service;
    return '';
  }

  /* ---- cards ---- */
  function tileHTML(x){
    var poster=x.poster
      ? '<img src="'+esc(x.poster)+'" alt="" loading="lazy" />'
      : '<span class="wl-tile-none">'+esc(x.title)+'</span>';
    return '<button class="wl-tile" data-id="'+x.id+'">'+poster
      +'<span class="wl-tile-title">'+esc(x.title)+'</span></button>';
  }
  function rowHTML(x){
    var poster=x.poster
      ? '<img class="wl-row-img" src="'+esc(x.poster)+'" alt="" loading="lazy" />'
      : '<span class="wl-row-none">'+esc((x.title||'?').slice(0,1))+'</span>';
    var sub=releaseLine(x);
    if(!sub) sub=streamLine(x);
    var meta=[x.year,sub].filter(Boolean).join(' · ');
    return '<button class="wl-tile wl-row" data-id="'+x.id+'">'+poster
      +'<span class="wl-row-main"><span class="wl-row-title">'+esc(x.title)+'</span>'
      +(meta?'<span class="wl-row-sub">'+esc(meta)+'</span>':'')
      +'</span></button>';
  }
  function findItem(id){ var f=null; items.forEach(function(x){ if(x.id===id) f=x; }); return f; }
  var wlFilters={service:'',status:'',sort:'alpha'}, wlView='grid';
  function applyWlFilters(list){
    var out=list.slice();
    if(wlFilters.service) out=out.filter(function(x){ return (x.service||'')===wlFilters.service; });
    if(wlFilters.status==='watched') out=out.filter(function(x){ return x.watched; });
    if(wlFilters.status==='unwatched') out=out.filter(function(x){ return !x.watched; });
    if(wlFilters.sort==='alpha') out.sort(function(a,b){ return (a.title||'').localeCompare(b.title||''); });
    else if(wlFilters.sort==='service') out.sort(function(a,b){ return (a.service||'').localeCompare(b.service||'')||(a.title||'').localeCompare(b.title||''); });
    /* 'recent' keeps insertion order */
    return out;
  }
  function render(){
    var t=view==='show'?'Show':'Movie';
    document.getElementById('wl-filter-btn').classList.toggle('active',!!(wlFilters.service||wlFilters.status||wlFilters.sort!=='alpha'));
    var towatch=applyWlFilters(items.filter(function(x){ return !x.watched&&x.type===t; }));
    var finished=applyWlFilters(items.filter(function(x){ return x.watched&&x.type===t; }));
    var mk=wlView==='list'?rowHTML:tileHTML;
    var grid=document.getElementById('wl-grid');
    grid.innerHTML=towatch.map(mk).join('');
    grid.classList.toggle('list-view', wlView==='list');
    document.getElementById('wl-empty').hidden=towatch.length>0||items.length>0;
    var fg=document.getElementById('wl-finished');
    fg.innerHTML=finished.map(mk).join('');
    fg.classList.toggle('list-view', wlView==='list');
    document.getElementById('wl-finished-h').hidden=finished.length===0;
    document.querySelectorAll('.wl-tab').forEach(function(b){
      b.classList.toggle('active',b.getAttribute('data-view')===view);
    });
    // populate service filter
    var svcs={}; items.forEach(function(x){ if(x.service) svcs[x.service]=1; });
    var sel=document.getElementById('wl-f-service'), cur=sel.value;
    sel.innerHTML='<option value="">All services</option>'+Object.keys(svcs).sort().map(function(s){ return '<option'+(s===cur?' selected':'')+'>'+esc(s)+'</option>'; }).join('');
  }

  /* ---- tabs ---- */
  document.querySelectorAll('.wl-tab').forEach(function(b){
    b.addEventListener('click',function(){ view=b.getAttribute('data-view'); render(); });
  });

  /* ---- filter panel + view toggle ---- */
  document.getElementById('wl-filter-btn').addEventListener('click',function(){
    var p=document.getElementById('wl-filter-panel');
    p.hidden=!p.hidden;
  });
  document.addEventListener('click',function(e){
    var p=document.getElementById('wl-filter-panel');
    if(!p||p.hidden) return;
    if(e.target.closest&&e.target.closest('#wl-filter-panel')) return;
    if(e.target.closest&&e.target.closest('#wl-filter-btn')) return;
    p.hidden=true;
  });
  document.getElementById('wl-view-toggle').addEventListener('click',function(){
    wlView=wlView==='grid'?'list':'grid';
    this.textContent=wlView==='grid'?'☰':'▦';
    render();
  });
  document.getElementById('wl-f-service').addEventListener('change',function(){ wlFilters.service=this.value; render(); });
  document.getElementById('wl-f-status').addEventListener('change',function(){ wlFilters.status=this.value; render(); });
  document.getElementById('wl-f-sort').addEventListener('change',function(){ wlFilters.sort=this.value; render(); });
  document.getElementById('wl-f-clear').addEventListener('click',function(){
    wlFilters={service:'',status:'',sort:'alpha'};
    document.getElementById('wl-f-service').value='';
    document.getElementById('wl-f-status').value='';
    document.getElementById('wl-f-sort').value='alpha';
    document.getElementById('wl-filter-panel').hidden=true;
    render();
  });

  /* ---- detail-sheet live info: release dates + streaming checks ---- */
  function streamLine(it){
    if(it.streamingService||it.streamingDate){
      var parts=[];
      if(it.streamingService) parts.push(it.streamingService);
      if(it.streamingDate){
        var d=new Date(it.streamingDate+'T12:00:00');
        if(!isNaN(d)) parts.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}));
      }
      return parts.length?('Streaming: '+parts.join(' · ')):'';
    }
    if(it.type==='Movie'&&it.streamingChecked&&it.releaseDate){
      var d2=new Date(it.releaseDate+'T12:00:00');
      if(!isNaN(d2)&&d2<=new Date()) return 'Streaming: not announced yet';
    }
    return '';
  }
  function refreshModalLines(it){
    if(modalItem!==it) return;
    var rel=document.getElementById('wl-m-rel');
    var rl=releaseLine(it);
    rel.textContent=rl; rel.style.display=rl?'':'none';
    var st=document.getElementById('wl-m-stream');
    var sl=streamLine(it);
    st.textContent=sl; st.style.display=sl?'':'none';
    var p=document.getElementById('wl-m-poster');
    if(it.poster&&p.style.display==='none'){ p.src=it.poster; p.style.display=''; }
    var link=document.getElementById('wl-m-link');
    if(it.info){ link.href=it.info; link.hidden=false; }
  }
  function fetchWikiText(it){
    function get(titles){
      var u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*'
        +'&prop=extracts&explaintext&titles='+encodeURIComponent(titles);
      return fetch(u).then(function(x){ return x.json(); }).then(function(d){
        var pages=(d.query&&d.query.pages)||{};
        var k=Object.keys(pages)[0];
        return (k&&pages[k].extract)?pages[k].extract:'';
      }).catch(function(){ return ''; });
    }
    var t='';
    if(it.info&&it.info.indexOf('/wiki/')>=0){
      try{ t=decodeURIComponent(it.info.split('/wiki/')[1].split('#')[0]); }catch(e){}
    }
    if(t) return get(t.replace(/_/g,' '));
    return wikiSearch(it.title).then(function(rs){
      var hit=null;
      rs.forEach(function(r){ if(!hit&&r.wiki) hit=r; });
      if(!hit) return '';
      if(!it.info&&hit.info) it.info=hit.info;
      return get(hit.wiki);
    });
  }
  function maybeRefreshRelease(it){
    if(it.tmdbId&&WL_TMDB_KEY) return;
    if(it.releaseDate) return;
    if(it.type==='Show'){
      tvSearch(it.title).then(function(rs){
        var hit=null;
        rs.forEach(function(r){ if(!hit&&r.premiered&&r.title.toLowerCase()===it.title.toLowerCase()) hit=r; });
        if(!hit) rs.forEach(function(r){ if(!hit&&r.premiered) hit=r; });
        if(hit){
          it.releaseDate=hit.premiered; it.releaseKind='premiere';
          if(!it.year) it.year=hit.year;
          if(!it.service&&hit.network) it.service=hit.network;
          if(!it.poster&&hit.poster) it.poster=hit.poster;
          touch(it); save(items); refreshModalLines(it);
        }
      });
    }else{
      fetchWikiText(it).then(function(txt){
        var info=parseWikiInfo(txt), changed=false;
        if(info.releaseDate){ it.releaseDate=info.releaseDate; it.releaseKind=info.releaseKind||'theatrical'; changed=true; }
        if(info.streamingService&&!it.streamingService){ it.streamingService=info.streamingService; changed=true; }
        if(info.streamingDate&&!it.streamingDate){ it.streamingDate=info.streamingDate; changed=true; }
        if(changed){ touch(it); save(items); refreshModalLines(it); }
      });
    }
  }
  function maybeCheckStreaming(it){
    if(it.tmdbId&&WL_TMDB_KEY) return;
    if(it.type!=='Movie'||it.streamingService) return;
    if(it.releaseDate){
      var d=new Date(it.releaseDate+'T12:00:00');
      if(!isNaN(d)&&d>new Date()) return; /* not in theaters yet */
    }
    if(it.streamingChecked&&Date.now()-it.streamingChecked<864e5){ refreshModalLines(it); return; }
    fetchWikiText(it).then(function(txt){
      var info=parseWikiInfo(txt);
      it.streamingChecked=Date.now();
      if(info.streamingService) it.streamingService=info.streamingService;
      if(info.streamingDate) it.streamingDate=info.streamingDate;
      touch(it); save(items); refreshModalLines(it);
    });
  }

  function maybeTmdbInfo(it){
    if(!WL_TMDB_KEY||!it.tmdbId) return;
    if(it.tmdbType==='movie'){
      if(!it.releaseDate||!it.streamingDate){
        tmdbGet('/movie/'+it.tmdbId+'/release_dates').then(function(d){
          var us=null;
          (d.results||[]).forEach(function(x){ if(x.iso_3166_1==='US') us=x; });
          var rows=(us&&us.release_dates)||[], changed=false;
          var th=null, dg=null;
          rows.forEach(function(x){
            if(x.type===3&&(!th||x.release_date<th)) th=x.release_date;
            if(x.type===4&&(!dg||x.release_date<dg)) dg=x.release_date;
          });
          if(th&&!it.releaseDate){ it.releaseDate=th.slice(0,10); it.releaseKind='theatrical'; changed=true; }
          if(dg&&!it.streamingDate){ it.streamingDate=dg.slice(0,10); changed=true; }
          if(changed){ touch(it); save(items); refreshModalLines(it); }
        }).catch(function(){});
      }
      if(!it.streamingService){
        tmdbGet('/movie/'+it.tmdbId+'/watch/providers').then(function(d){
          var us=((d.results||{}).US)||{};
          var flat=(us.flatrate||[]).map(function(p){ return p.provider_name; });
          var plain=flat.filter(function(n){ return n.indexOf(' Channel')<0; });
          var names=(plain.length?plain:flat).slice(0,2);
          if(names.length){ it.streamingService=names.join(' · '); it.streamingChecked=Date.now(); touch(it); save(items); refreshModalLines(it); }
        }).catch(function(){});
      }
    }else if(it.tmdbType==='tv'){
      if(!it.releaseDate||!it.service){
        tmdbGet('/tv/'+it.tmdbId).then(function(d){
          var changed=false;
          if(d.first_air_date&&!it.releaseDate){ it.releaseDate=d.first_air_date; it.releaseKind='premiere'; changed=true; }
          if(d.networks&&d.networks.length&&!it.service){ it.service=d.networks[0].name; changed=true; }
          if(changed){ touch(it); save(items); refreshModalLines(it); }
        }).catch(function(){});
      }
    }
  }

  /* ---- detail sheet ---- */
  var modalItem=null;
  function openModal(it){
    modalItem=it;
    var p=document.getElementById('wl-m-poster');
    if(it.poster){ p.src=it.poster; p.style.display=''; }
    else{ p.removeAttribute('src'); p.style.display='none'; }
    document.getElementById('wl-m-title').textContent=it.title;
    var rel=releaseLine(it);
    var relEl=document.getElementById('wl-m-rel');
    relEl.textContent=rel; relEl.style.display=rel?'':'none';
    var stEl=document.getElementById('wl-m-stream');
    var stl=streamLine(it); stEl.textContent=stl; stEl.style.display=stl?'':'none';
    var link=document.getElementById('wl-m-link');
    if(it.info){ link.href=it.info; link.hidden=false; } else link.hidden=true;
    var prog=document.getElementById('wl-m-prog');
    prog.innerHTML=it.progress?'Progress: <strong>'+esc(it.progress)+'</strong>':'Set progress';
    var done=document.getElementById('wl-m-done');
    done.textContent=it.watched?'↩ Move back to watchlist':'✓ Watched';
    document.getElementById('wl-modal').hidden=false;
    document.body.style.overflow='hidden';
    maybeRefreshRelease(it);
    maybeCheckStreaming(it);
    maybeTmdbInfo(it);
  }
  function closeModal(){
    document.getElementById('wl-modal').hidden=true;
    document.body.style.overflow='';
    modalItem=null;
  }
  document.getElementById('wl-modal').addEventListener('click',function(e){
    if(e.target.closest('[data-m="close"]')) closeModal();
  });
  document.getElementById('wl-m-done').addEventListener('click',function(){
    if(!modalItem) return;
    modalItem.watched=!modalItem.watched;
    touch(modalItem);
    save(items); closeModal(); render();
  });
  document.getElementById('wl-m-del').addEventListener('click',function(){
    if(!modalItem) return;
    var it=modalItem;
    items=items.filter(function(x){ return x.id!==it.id; });
    fbDelete(it);
    save(items); closeModal(); render();
  });
  document.getElementById('wl-m-prog').addEventListener('click',function(){
    if(!modalItem) return;
    var it=modalItem, btn=this, cur=it.progress||'';
    var inp=document.createElement('input');
    inp.className='wl-prog-input'; inp.value=cur; inp.placeholder='S2 E5, 50%…';
    inp.setAttribute('aria-label','Progress');
    btn.replaceWith(inp); inp.focus(); inp.select();
    var done=false;
    function commit(ok){
      if(done) return; done=true;
      if(ok){ it.progress=inp.value.trim(); touch(it); }
      save(items); openModal(it);
    }
    inp.addEventListener('keydown',function(ev){
      if(ev.key==='Enter') commit(true);
      else if(ev.key==='Escape') commit(false);
    });
    inp.addEventListener('blur',function(){ commit(true); });
  });
  function gridClick(e){
    var tile=e.target.closest('.wl-tile'); if(!tile) return;
    var it=findItem(tile.getAttribute('data-id')); if(!it) return;
    openModal(it);
  }

  /* ---- add ---- */
  function commitAdd(r){
    var t=(r&&r.title)?r.title:titleInput.value.trim(); if(!t) return;
    var type=(r&&r.type)?r.type:(view==='show'?'Show':'Movie');
    var it={id:Date.now()+''+Math.floor(Math.random()*1e6),title:t,type:type,
      service:'',notes:'',progress:'',watched:false,added:new Date().toISOString()};
    if(r){
      it.year=r.year||''; it.info=r.info||''; it.poster=r.poster||'';
      if(r.network) it.service=r.network;
      if(r.premiered){ it.releaseDate=r.premiered; it.releaseKind='premiere'; }
      else if(r.releaseDate){ it.releaseDate=r.releaseDate; it.releaseKind=r.releaseKind||'theatrical'; }
      if(r.status) it.notes=r.status;
      if(r.tmdbId){ it.tmdbId=r.tmdbId; it.tmdbType=r.tmdbType; }
      if(r.streamingService) it.streamingService=r.streamingService;
      if(r.streamingDate) it.streamingDate=r.streamingDate;
      if(it.streamingService||it.streamingDate) it.streamingChecked=Date.now();
    }
    items.unshift(it);
    touch(it);
    save(items);
    titleInput.value=''; picked=null; suggestBox.hidden=true;
    view=type==='Show'?'show':'movie';
    render();
  }
  document.getElementById('wl-form').addEventListener('submit',function(e){
    e.preventDefault();
    commitAdd(picked);
  });

  /* ---- card actions ---- */

  document.getElementById('wl-grid').addEventListener('click',function(e){ gridClick(e); });
  document.getElementById('wl-finished').addEventListener('click',function(e){ gridClick(e); });

  /* ---- TMDB key (kept in this device + the watchlist cloud, never in the page code) ---- */
  function tmdbBtnLabel(){
    var b=document.getElementById('wl-tmdb-btn');
    if(b) b.textContent=WL_TMDB_KEY?'TMDB ✓':'TMDB key';
  }
  function setTmdbKey(k){
    WL_TMDB_KEY=k||'';
    try{ if(WL_TMDB_KEY) localStorage.setItem('wl-tmdb-key',WL_TMDB_KEY); else localStorage.removeItem('wl-tmdb-key'); }catch(e){}
    if(fbDb&&fbReady&&!SHARED){ try{ fbDb.ref('watchlist/config').update({tmdbKey:WL_TMDB_KEY}); }catch(e){} }
    tmdbBtnLabel();
  }
  (function(){
    var b=document.getElementById('wl-tmdb-btn');
    if(!b) return;
    tmdbBtnLabel();
    b.addEventListener('click',function(){
      var k=prompt(WL_TMDB_KEY?'TMDB search is on. Paste a new key to replace it, or clear the box and tap OK to turn it off.':'Paste your TMDB API key (the v3 one, from themoviedb.org, Settings, API):',WL_TMDB_KEY);
      if(k===null) return;
      setTmdbKey(k.trim());
    });
  })();

  /* ---- share ---- */
  document.getElementById('wl-share').addEventListener('click',function(){
    var btn=this;
    var url=buildSyncLink();
    function ok(){ btn.textContent='Copied!'; setTimeout(function(){btn.textContent='Share';},2000); }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(ok,function(){ prompt('Copy your share link:',url); });
    }else{ prompt('Copy your share link:',url); }
  });



  if(SHARED){
    document.body.classList.add('wl-shared');
    var _f=document.getElementById('wl-form'); if(_f) _f.style.display='none';
    var _sh=document.getElementById('wl-share'); if(_sh) _sh.style.display='none';
    var bar=document.querySelector('#watchlist .viewbar');
    if(bar){
      var saveBtn=document.createElement('button');
      saveBtn.className='btn small accent'; saveBtn.textContent='Save to this device';
      saveBtn.style.marginLeft='8px';
      saveBtn.addEventListener('click',function(){
        try{
          localStorage.setItem(KEY, JSON.stringify(SHARED));
          localStorage.setItem('wl-seed-ver','3');
        }catch(e){}
        location.hash=''; location.reload();
      });
      bar.appendChild(saveBtn);
    }
  }
  render();
  initFirebase();
})();
</script>
